<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBO 매니저 2026 — 한국프로야구 매니지먼트</title>
<style>
:root{
  --bg:#0e1116; --panel:#171c24; --panel2:#1f2630; --line:#2a323d;
  --txt:#e6e9ee; --dim:#93a0b0; --accent:#ea0029; --accent2:#ffd200;
  --good:#36c275; --warn:#f0a020; --bad:#e0556a; --blue:#3b82f6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;}
#app{max-width:1200px;margin:0 auto;padding:0 14px 60px;}
header.top{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:2px solid var(--accent);position:sticky;top:0;background:var(--bg);z-index:30;flex-wrap:wrap;}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;}
.logo span{color:var(--accent);}
.teaminfo{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);}
.teamdot{width:14px;height:14px;border-radius:50%;display:inline-block;}
.headctrl{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0;}
nav.tabs button{background:var(--panel);color:var(--dim);border:1px solid var(--line);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
nav.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
nav.tabs button:hover:not(.active){background:var(--panel2);color:var(--txt);}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{filter:brightness(1.1);}
.btn.gold{background:var(--accent2);color:#222;border-color:var(--accent2);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.grid{display:grid;gap:14px;}
.cols2{grid-template-columns:1fr 1fr;}
.cols3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){.cols2,.cols3{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;}
.card h3 .tag{font-size:11px;color:var(--dim);font-weight:500;margin-left:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;cursor:default;}
td.name,th.name{text-align:left;}
tr:hover td{background:rgba(255,255,255,.03);}
.pill{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;}
.pos{background:var(--panel2);color:var(--dim);}
.ovr{font-weight:800;}
.ovr.s90{color:#ffd200;} .ovr.s80{color:#36c275;} .ovr.s70{color:#7fd0ff;} .ovr.s60{color:var(--txt);} .ovr.s0{color:var(--dim);}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;display:inline-block;width:46px;vertical-align:middle;}
.bar>i{display:block;height:100%;}
.muted{color:var(--dim);}
.big{font-size:28px;font-weight:800;}
.scoreboard{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 0;}
.scoreboard .t{text-align:center;min-width:90px;}
.scoreboard .sc{font-size:40px;font-weight:800;}
.win{color:var(--good);}
.lose{color:var(--dim);}
select,input{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;padding:20px;}
.modal h2{margin:0 0 4px;}
.closeX{float:right;cursor:pointer;color:var(--dim);font-size:22px;line-height:1;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.linescore td,.linescore th{padding:4px 6px;font-size:12px;}
.kpi{display:flex;gap:18px;flex-wrap:wrap;}
.kpi .k{background:var(--panel2);border-radius:10px;padding:10px 14px;min-width:90px;}
.kpi .k .v{font-size:22px;font-weight:800;}
.kpi .k .l{font-size:11px;color:var(--dim);}
.hint{font-size:12px;color:var(--dim);line-height:1.6;}
.rankrow.me{background:rgba(234,0,41,.12);}
.tabsm{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;}
.tabsm button{font-size:12px;padding:5px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--dim);cursor:pointer;}
.tabsm button.active{background:var(--accent);color:#fff;}
.progress{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:6px;}
.progress>i{display:block;height:100%;background:var(--accent);}
.trade-side{flex:1;min-width:240px;}
.checkitem{display:flex;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid var(--line);font-size:13px;}
.checkitem:hover{background:rgba(255,255,255,.03);}
.deal-result{padding:10px;border-radius:8px;margin-top:10px;font-weight:600;}
.deal-ok{background:rgba(54,194,117,.15);color:var(--good);}
.deal-no{background:rgba(224,85,106,.15);color:var(--bad);}
footer{text-align:center;color:var(--dim);font-size:11px;margin-top:30px;line-height:1.7;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">KBO <span>매니저</span> 2026</div>
    <div class="teaminfo" id="teaminfo"></div>
    <div class="headctrl">
      <button class="btn" onclick="App.save()">💾 저장</button>
      <button class="btn" onclick="App.load()">📂 불러오기</button>
      <button class="btn" onclick="App.confirmNew()">🔄 새 게임</button>
      <button class="btn" onclick="App.selfTest()" title="풀시즌을 시뮬레이션해 통계 현실성을 확인">🔬 엔진검증</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
  <footer>
    KBO 매니저 — 실제 KBO 2025 시즌 로스터/이적 기반 (능력치는 기록 데이터 근사값). 재미를 위한 비공식 시뮬레이션입니다.<br>
    데이터: koreabaseball.com, namu.wiki 참고 · 엔진은 타석 단위 확률 시뮬레이션
  </footer>
</div>

<script src="core.js"></script>
<script>
"use strict";
const K = window.KBO;
const USER = "KIA";
const SEASON_GAMES = 144;

// ---------- helpers ----------
function $(id){return document.getElementById(id);}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function fmtAvg(x){ if(!isFinite(x))x=0; return x.toFixed(3).replace(/^0\./,'.'); }
function fmtEra(er,outs){ if(!outs)return "-"; return (er*9/(outs/3)).toFixed(2); }
function ipStr(outs){ return Math.floor(outs/3)+ (outs%3? " "+(outs%3)+"/3":""); }
function ovrClass(v){ return v>=90?'s90':v>=80?'s80':v>=70?'s70':v>=60?'s60':'s0'; }
function ratColor(v){ return v>=85?'#ffd200':v>=75?'#36c275':v>=65?'#7fd0ff':v>=55?'#9aa7b6':'#6b7785'; }
function bar(v){ return `<span class="bar"><i style="width:${Math.max(4,(v-30)/0.7)}%;background:${ratColor(v)}"></i></span>`; }
function ratNum(v){ return `<b style="color:${ratColor(v)}">${v}</b>`; }
function ratBox(label,v){ return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 11px;background:var(--panel2);border-radius:7px;margin-bottom:6px"><span class="muted">${label}</span><b style="color:${ratColor(v)};font-size:16px">${v}</b></div>`; }
function pname(team,n){ return `<a href="javascript:void(0)" onclick="App.player('${team}','${n.replace(/'/g,"\\'")}')" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--dim)">${n}</a>`; }
function teamDot(t){ return `<span class="teamdot" style="background:${K.ROSTERS[t].color}"></span>`; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

// ---------- state ----------
let state = null;
let teamGameCount = {};
let currentTab = "dash";

function newBatSeason(){ const s=K.newBatStat(); s.G=0; return s; }
function newPitSeason(){ const s=K.newPitStat(); return s; }

function roundRobin(teams){
  const n=teams.length, arr=teams.slice(), rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++) pairs.push([arr[i],arr[n-1-i]]);
    rounds.push(pairs);
    arr.splice(1,0,arr.pop());
  }
  return rounds;
}
function buildSchedule(){
  const rounds = roundRobin(K.TEAM_IDS); // 9 rounds x 5 pairs
  const sched=[]; let day=0;
  const cycles = SEASON_GAMES / (K.TEAM_IDS.length-1); // 144/9 = 16
  for(let c=0;c<cycles;c++){
    rounds.forEach(pairs=>{
      pairs.forEach(p=>{
        const home = (c%2===0)? p[0]:p[1];
        const away = (c%2===0)? p[1]:p[0];
        sched.push({day:day, home, away, played:false, hr:0, ar:0});
      });
      day++;
    });
  }
  return sched;
}

function initState(){
  // reset rosters to original (in case prior game mutated)
  state = {
    year: 2026,
    cfgs: {},
    season: {},
    schedule: buildSchedule(),
    gameIdx: 0,
    phase: "regular", // regular | postseason | offseason
    history: [],
    champion: null,
    postseason: null,
    pendingGame: null
  };
  K.TEAM_IDS.forEach(t=>{
    const d = K.defaultLineup(t);
    state.cfgs[t] = {teamId:t, lineup:d.lineup.slice(), rotation:d.rotation.slice(), bullpen:d.bullpen.slice(), closer:d.closer};
    state.season[t] = {W:0,L:0,T:0,RF:0,RA:0,bat:{},pit:{}};
  });
  teamGameCount = {}; K.TEAM_IDS.forEach(t=>teamGameCount[t]=0);
}

// ---------- stat accumulation ----------
function mergeNum(t,s){ for(const k in s){ if(typeof s[k]==='number') t[k]=(t[k]||0)+s[k]; } }
function eBat(team,n){ const b=state.season[team].bat; if(!b[n]) b[n]=newBatSeason(); return b[n]; }
function ePit(team,n){ const p=state.season[team].pit; if(!p[n]) p[n]=newPitSeason(); return p[n]; }

function accumulate(res){
  [res.home,res.away].forEach(team=>{
    const bx=res.box[team];
    for(const n in bx.bat){ const src=bx.bat[n]; const t=eBat(team,n); mergeNum(t,src); if(src.PA>0)t.G++; }
    for(const n in bx.pit){ const src=bx.pit[n]; const t=ePit(team,n); mergeNum(t,src); t.G++; }
  });
  ePit(res.home,res.homeSP).GS++;
  ePit(res.away,res.awaySP).GS++;
  const s=state.season;
  s[res.home].RF+=res.homeRuns; s[res.home].RA+=res.awayRuns;
  s[res.away].RF+=res.awayRuns; s[res.away].RA+=res.homeRuns;
  if(res.winner===null){ s[res.home].T++; s[res.away].T++; }
  else { const lo = res.winner===res.home?res.away:res.home; s[res.winner].W++; s[lo].L++; assignDecisions(res); }
}
function assignDecisions(res){
  const winner=res.winner, loser=winner===res.home?res.away:res.home, box=res.box;
  const wsp = winner===res.home?res.homeSP:res.awaySP;
  let winP=wsp;
  const wspOut = box[winner].pit[wsp]? box[winner].pit[wsp].OUT:0;
  if(wspOut<15){ let mx=-1; for(const n in box[winner].pit){ const o=box[winner].pit[n].OUT; if(o>mx){mx=o;winP=n;} } }
  ePit(winner,winP).W++;
  let loseP=loser===res.home?res.homeSP:res.awaySP, mxr=-1;
  for(const n in box[loser].pit){ const e=box[loser].pit[n].ER; if(e>mxr){mxr=e;loseP=n;} }
  ePit(loser,loseP).L++;
  const margin=Math.abs(res.homeRuns-res.awayRuns);
  const closer=state.cfgs[winner].closer;
  if(margin>=1&&margin<=3&&closer&&closer!==winP&&box[winner].pit[closer]&&box[winner].pit[closer].OUT>=2){
    ePit(winner,closer).SV++;
  } else if(closer&&closer!==winP&&box[winner].pit[winP]) {
    // hold approximation for setup arms in close win
  }
}

function buildCfg(team){
  const c=state.cfgs[team];
  const rot=c.rotation.length?c.rotation:[c.bullpen[0]];
  const sp=rot[teamGameCount[team]%rot.length];
  return {teamId:team, lineup:c.lineup, bullpen:c.bullpen, closer:c.closer, spName:sp};
}
function playGame(idx, detail){
  const g=state.schedule[idx];
  if(g.played) return null;
  const hc=buildCfg(g.home), ac=buildCfg(g.away);
  const res=K.simGame(hc,ac,{log:!!detail});
  accumulate(res);
  g.played=true; g.hr=res.homeRuns; g.ar=res.awayRuns;
  teamGameCount[g.home]++; teamGameCount[g.away]++;
  return res;
}

// ---------- sim controls ----------
// New flow: auto-sim other teams' games up to our next game, then show PREVIEW (entry submission).
function startNextUserGame(){
  if(state.phase!=="regular"){ render(); return; }
  while(state.gameIdx<state.schedule.length){
    const g=state.schedule[state.gameIdx];
    if(g.home===USER||g.away===USER){ state.pendingGame=state.gameIdx; openPreview(); return; }
    playGame(state.gameIdx,false); state.gameIdx++;
  }
  endRegularSeason(); render();
}
function advanceUserGames(n){
  state.pendingGame=null; closeModal();
  for(let i=0;i<n;i++){
    if(state.gameIdx>=state.schedule.length||state.phase!=="regular") break;
    let done=false;
    while(state.gameIdx<state.schedule.length){
      const g=state.schedule[state.gameIdx];
      const isUser=(g.home===USER||g.away===USER);
      playGame(state.gameIdx,false);
      state.gameIdx++;
      if(isUser){done=true;break;}
    }
    if(!done) break;
  }
  if(state.gameIdx>=state.schedule.length) endRegularSeason();
  render();
}
function simRestOfSeason(){
  state.pendingGame=null; closeModal();
  while(state.gameIdx<state.schedule.length){ playGame(state.gameIdx,false); state.gameIdx++; }
  endRegularSeason(); render();
}

// ---------- preview (entry submission) ----------
function recentForm(team){
  const gs=state.schedule.filter(g=>g.played&&(g.home===team||g.away===team)).slice(-5);
  return gs.map(g=>{ const us=g.home===team?g.hr:g.ar, them=g.home===team?g.ar:g.hr;
    return us>them?'<span style="color:var(--good)">승</span>':us<them?'<span style="color:var(--bad)">패</span>':'<span class="muted">무</span>'; }).join(' ')||'<span class="muted">-</span>';
}
function projectedSP(team){
  const c=state.cfgs[team]; const rot=c.rotation.length?c.rotation:[c.bullpen[0]];
  return rot[teamGameCount[team]%rot.length];
}
function openPreview(){
  const idx=state.pendingGame; const g=state.schedule[idx];
  const st=standings();
  const rankOf=t=>st.findIndex(x=>x.t===t)+1;
  const opp = g.home===USER?g.away:g.home;
  const usHome = g.home===USER;
  const spUser=projectedSP(USER), spOpp=projectedSP(opp);
  const su=findPlayer(USER,spUser), so=findPlayer(opp,spOpp);
  const teamCard=(t)=>{ const s=state.season[t]; return `<div style="text-align:center;flex:1">
      ${teamDot(t)} <div style="font-size:16px;font-weight:800;margin:4px 0">${K.ROSTERS[t].name}</div>
      <div class="muted" style="font-size:12px">${rankOf(t)}위 · ${s.W}승 ${s.L}패 ${s.T}무</div>
      <div style="font-size:12px;margin-top:4px">최근5: ${recentForm(t)}</div></div>`; };
  const spStat=(t,n)=>{ const s=state.season[t].pit[n]; return s&&s.G>0? `${s.W}승 ${s.L}패 · ERA ${fmtEra(s.ER,s.OUT)}` : '시즌 첫 등판'; };
  const lineupList=(t)=>{ const c=state.cfgs[t]; return c.lineup.map((n,i)=>{ const b=findPlayer(t,n); return `<div style="display:flex;gap:8px;font-size:12px;padding:2px 0"><span class="muted" style="width:16px">${i+1}</span><span class="pill pos" style="width:30px">${b?b.pos:''}</span>${t===USER?pname(t,n):n}</div>`; }).join(''); };
  modal(`<span class="closeX" onclick="App.cancelPreview()">×</span>
    <div class="muted" style="font-size:12px">${state.year} 시즌 · ${usHome?'홈경기 🏠':'원정경기 ✈'} · 경기 프리뷰</div>
    <div class="row" style="align-items:center;margin:10px 0 4px">
      ${teamCard(g.away)}<div class="big" style="color:var(--dim)">VS</div>${teamCard(g.home)}
    </div>
    <div class="card" style="background:var(--panel2);margin:12px 0">
      <div class="muted" style="text-align:center;font-weight:700;margin-bottom:8px">⚾ 선발 맞대결</div>
      <div class="row" style="justify-content:space-around">
        <div style="text-align:center"><b>${usHome?(opp+' 선발'):'우리 선발'}</b><div style="font-size:15px;margin:2px 0">${usHome? so?so.n:spOpp : pname(USER,spUser)}</div><div class="muted" style="font-size:12px">${usHome? spStat(opp,spOpp):spStat(USER,spUser)}</div></div>
        <div class="muted">VS</div>
        <div style="text-align:center"><b>${usHome?'우리 선발':(opp+' 선발')}</b><div style="font-size:15px;margin:2px 0">${usHome? pname(USER,spUser):(so?so.n:spOpp)}</div><div class="muted" style="font-size:12px">${usHome? spStat(USER,spUser):spStat(opp,spOpp)}</div></div>
      </div>
    </div>
    <div class="grid cols2">
      <div><div class="muted" style="font-weight:700;margin-bottom:4px">우리 타선 (KIA)</div>${lineupList(USER)}</div>
      <div><div class="muted" style="font-weight:700;margin-bottom:4px">상대 예상 타선</div>${lineupList(opp)}</div>
    </div>
    <div class="hint" style="margin-top:10px">라인업·선발을 바꾸려면 먼저 닫고 <b>라인업</b> 탭에서 수정하세요. 제출 후 실시간 중계가 시작됩니다.</div>
    <div class="row" style="justify-content:center;margin-top:14px;gap:8px">
      <button class="btn" onclick="App.closeModal();App.tab('lineup')">📋 라인업 수정</button>
      <button class="btn primary" onclick="App.startMatch()">✅ 엔트리 제출 & 경기 시작</button>
    </div>`);
}

// ---------- live relay ----------
const Match={ game:null, idx:null, timer:null, speed:650, paused:true, _ended:false, panel:null, ab:null, feed:null,
  start(){
    const idx=state.pendingGame; const g=state.schedule[idx];
    this.idx=idx; this.game=new K.InteractiveGame(buildCfg(g.home), buildCfg(g.away));
    this._ended=false; this.paused=false; this.panel=null; this.feed=[]; this.ab=null;
    closeModal();
    let o=document.getElementById('relay'); if(o)o.remove();
    o=el('<div id="relay" class="modal-bg" style="align-items:stretch;padding:0"></div>');
    document.body.appendChild(o);
    this.renderLive();
    this._tick();
  },
  _tick(){ if(this.paused) return; this._do(); if(!this._ended) this.timer=setTimeout(()=>this._tick(), this.speed); },
  _do(){
    const g=this.game;
    if(g.over && (!this.ab || this.ab.committed)){ this.end(); return; }
    if(!this.ab){ const p=g.prepareAB(); if(!p){ this.end(); return; } this.ab={pitches:p.pitches,shown:0,committed:false,pitName:p.pitName,batName:p.batName,off:p.off,def:p.def,slot:p.slot,ev:null}; this.renderLive(); return; }
    if(this.ab.shown < this.ab.pitches.length){ this.ab.shown++; this.renderLive(); return; }
    if(!this.ab.committed){ const ev=g.commitAB(); this.ab.committed=true; this.ab.ev=ev; if(ev)this.feed.unshift(ev); this.renderLive(); return; }
    this.ab=null; this.renderLive();
  },
  play(){ if(this._ended)return; this.paused=false; this.renderLive(); this._tick(); },
  pause(){ this.paused=true; clearTimeout(this.timer); this.renderLive(); },
  stepOne(){ this.paused=true; clearTimeout(this.timer); this._do(); },
  toEnd(){ this.paused=true; clearTimeout(this.timer);
    if(this.ab && !this.ab.committed){ const ev=this.game.commitAB(); if(ev)this.feed.unshift(ev); }
    this.ab=null;
    let n=0; while(!this.game.over && n<3000){ const ev=this.game.step(); if(ev)this.feed.unshift(ev); n++; }
    this.renderLive(); this.end();
  },
  setSpeed(v){ this.speed=parseInt(v,10); },
  togglePanel(p){ this.panel=this.panel===p?null:p; if(!this.paused)this.pause(); else this.renderLive(); },
  doSub(name){ this.game.subPitcher(USER,name); this.panel=null; this.feed.unshift({sysmsg:`투수 교체 → ${name} (다음 타자부터)`}); this.renderLive(); },
  doPinch(name){ this.game.pinchHit(USER,name); this.panel=null; this.feed.unshift({sysmsg:`대타 예고 → ${name} (다음 타석)`}); this.renderLive(); },
  end(){ if(this._ended)return; this._ended=true; this.paused=true; clearTimeout(this.timer); this.renderLive(); },
  finalize(){
    const res=this.game.result(); accumulate(res);
    const g=state.schedule[this.idx]; g.played=true; g.hr=res.homeRuns; g.ar=res.awayRuns;
    teamGameCount[g.home]++; teamGameCount[g.away]++;
    state.gameIdx=this.idx+1; state.pendingGame=null;
    const o=document.getElementById('relay'); if(o)o.remove();
    this.game=null; this.ab=null;
    if(state.gameIdx>=state.schedule.length) endRegularSeason();
    render();
  },
  renderLive(){ const o=document.getElementById('relay'); if(o) o.innerHTML=`<div class="modal" style="max-width:520px;width:100%;margin:auto;max-height:96vh;overflow:auto;padding:14px">${relayHTML(this.game,this.feed,this)}</div>`; }
};

// ----- pitch-scene helpers -----
function jno(name){ let s=0; for(let i=0;i<name.length;i++)s=(s*31+name.charCodeAt(i))%97; return s+1; }
function handB(name){ let s=0; for(let i=0;i<name.length;i++)s+=name.charCodeAt(i); const m=s%10; return m<3?'좌':(m<4?'양':'우'); }
function handP(name){ let s=0; for(let i=0;i<name.length;i++)s+=name.charCodeAt(i)*2; return (s%10<3)?'좌':'우'; }
function countOf(pitches){ let b=0,s=0; pitches.forEach(p=>{ if(p.res==='B')b++; else if(p.res==='F'){ if(s<2)s++; } else if(p.res==='S'||p.res==='SW')s++; }); return {b:Math.min(b,4),s:Math.min(s,3)}; }
const PITCHCOLOR={B:'#6b7785',S:'#e0556a',SW:'#f0a020',F:'#7fd0ff',IP:'#36c275',HBP:'#c060e0'};
const PITCHLABEL={B:'볼',S:'스트라이크',SW:'헛스윙',F:'파울',IP:'타격',HBP:'사구'};
function baseMini(bases){
  const f=i=>bases[i]?'var(--accent2)':'rgba(255,255,255,.28)';
  return `<svg width="32" height="32" viewBox="0 0 32 32" style="vertical-align:middle">
    <rect x="19" y="12" width="8" height="8" transform="rotate(45 23 16)" fill="${f(0)}"/>
    <rect x="12" y="5" width="8" height="8" transform="rotate(45 16 9)" fill="${f(1)}"/>
    <rect x="5" y="12" width="8" height="8" transform="rotate(45 9 16)" fill="${f(2)}"/>
  </svg>`;
}
function pitchZone(pitches){
  const W=300,H=240;
  const mx=x=>40+x*220, my=y=>30+y*175;
  const zx0=mx(0.33),zx1=mx(0.67),zy0=my(0.30),zy1=my(0.70),zw=zx1-zx0,zh=zy1-zy0;
  let grid='';
  for(let i=1;i<3;i++){ grid+=`<line x1="${zx0+zw*i/3}" y1="${zy0}" x2="${zx0+zw*i/3}" y2="${zy1}" stroke="rgba(255,255,255,.18)"/><line x1="${zx0}" y1="${zy0+zh*i/3}" x2="${zx1}" y2="${zy0+zh*i/3}" stroke="rgba(255,255,255,.18)"/>`; }
  let dots='';
  pitches.forEach((p,i)=>{ const cx=mx(p.x).toFixed(0), cy=my(p.y).toFixed(0), c=PITCHCOLOR[p.res]||'#888', isLast=i===pitches.length-1;
    dots+=`<circle cx="${cx}" cy="${cy}" r="${isLast?11:9}" fill="${c}" stroke="#fff" stroke-width="${isLast?2:1}" opacity="${isLast?1:.82}"/><text x="${cx}" y="${(+cy+4)}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${i+1}</text>`; });
  const last=pitches[pitches.length-1];
  const bubble = last? `<rect x="${W/2-72}" y="6" width="144" height="36" rx="9" fill="rgba(14,17,22,.92)" stroke="rgba(255,255,255,.25)"/><text x="${W/2}" y="21" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="700">${pitches.length}구 ${last.type}</text><text x="${W/2}" y="36" text-anchor="middle" font-size="12.5" fill="#ffd200" font-weight="800">${last.velo} km/h</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:330px;display:block;margin:0 auto;background:linear-gradient(180deg,#16344a 0%,#14422a 100%);border-radius:12px">
    <rect x="${zx0}" y="${zy0}" width="${zw}" height="${zh}" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.6)" stroke-width="2"/>
    ${grid}
    <polygon points="${W/2-24},${H-22} ${W/2+24},${H-22} ${W/2+24},${H-14} ${W/2},${H-6} ${W/2-24},${H-14}" fill="#eaeaea" opacity=".85"/>
    ${dots}
    ${bubble}
  </svg>`;
}

// ---------- standings ----------
function standings(){
  return K.TEAM_IDS.map(t=>{
    const s=state.season[t];
    const gp=s.W+s.L+s.T;
    const pct = (s.W+s.L)? s.W/(s.W+s.L):0;
    return {t, W:s.W, L:s.L, T:s.T, gp, pct, RF:s.RF, RA:s.RA, diff:s.RF-s.RA};
  }).sort((a,b)=> b.pct-a.pct || b.diff-a.diff);
}

// ---------- postseason ----------
function neutralCfg(team,gameNo){
  const c=state.cfgs[team];
  const rot=c.rotation.length?c.rotation:[c.bullpen[0]];
  return {teamId:team, lineup:c.lineup, bullpen:c.bullpen, closer:c.closer, spName:rot[gameNo%rot.length]};
}
// KBO postseason: games go to 15 innings; a tie still counts as a game played but gives no win.
// opts.hiStart = wins credited to the higher seed up front, opts.maxGames = series cap,
// opts.hiHomeAll = every game at the higher seed's park (wild card).
function simSeries(seedHi, seedLo, bestOf, opts){
  opts=opts||{};
  const need=Math.ceil(bestOf/2), maxGames=opts.maxGames||Infinity, hiStart=opts.hiStart||0;
  let wHi=hiStart,wLo=0,gameNo=0; const games=[];
  // stop once the lower seed can no longer reach `need` in the games left
  while(wHi<need && wLo<need && need-wLo<=maxGames-gameNo){
    const hiHome = opts.hiHomeAll || (gameNo<2)|| (gameNo>=4); // simple home pattern favoring hi seed
    const home= hiHome? seedHi:seedLo, away= hiHome? seedLo:seedHi;
    const res=K.simGame(neutralCfg(home,gameNo),neutralCfg(away,gameNo),{maxInnings:15});
    const gw = res.winner;
    if(gw===seedHi)wHi++; else if(gw===seedLo)wLo++;
    games.push({home,away,hr:res.homeRuns,ar:res.awayRuns,winner:gw});
    gameNo++;
  }
  const hiWon = wLo<need;
  return {winner: hiWon?seedHi:seedLo, loser: hiWon?seedLo:seedHi, wHi,wLo,games,bestOf,hiStart};
}
function runPostseason(){
  const st=standings();
  const seed=st.slice(0,5).map(x=>x.t);
  const ps={seeds:seed, rounds:[]};
  // wild card: 4 vs 5 at seed4's park, up to 2 games; seed4 starts with a 1-win edge,
  // so seed5 must win twice and a tie sends seed4 through
  const wc=simSeries(seed[3],seed[4],3,{hiStart:1,maxGames:2,hiHomeAll:true});
  ps.rounds.push({name:"와일드카드", hi:seed[3], lo:seed[4], r:wc});
  const semi=simSeries(seed[2],wc.winner,5);
  ps.rounds.push({name:"준플레이오프", hi:seed[2], lo:wc.winner, r:semi});
  const po=simSeries(seed[1],semi.winner,5);
  ps.rounds.push({name:"플레이오프", hi:seed[1], lo:semi.winner, r:po});
  const ks=simSeries(seed[0],po.winner,7);
  ps.rounds.push({name:"한국시리즈", hi:seed[0], lo:po.winner, r:ks});
  ps.champion=ks.winner;
  state.postseason=ps;
  state.champion=ks.winner;
  state.phase="offseason";
}
function endRegularSeason(){
  if(state.phase!=="regular") return;
  state.phase="postseason";
  runPostseason();
  // record history
  const st=standings();
  state.history.push({year:state.year, champion:state.champion, standings:st.map(x=>({t:x.t,W:x.W,L:x.L,pct:x.pct})), userRank: st.findIndex(x=>x.t===USER)+1});
  showSeasonEndModal();
}

// ---------- next season (aging) ----------
function ageRosters(){
  for(const t in K.ROSTERS){
    K.ROSTERS[t].batters.forEach(p=>{
      p.age++;
      const d = ageDelta(p.age);
      ['con','pow','eye'].forEach(k=> p[k]=clamp(p[k]+d+rint(-1,1),40,99));
      ['spd','fld','arm'].forEach(k=> p[k]=clamp(p[k]+ (p.age>=31? d-1 : d) + rint(-1,1),40,99));
    });
    K.ROSTERS[t].pitchers.forEach(p=>{
      p.age++;
      const d=ageDelta(p.age);
      ['stu','ctl','mov'].forEach(k=> p[k]=clamp(p[k]+d+rint(-1,1),40,99));
      p.sta=clamp(p.sta + (p.age>=32? d-1:d) + rint(-1,1),35,99);
    });
  }
}
function ageDelta(age){ if(age<=23)return 2; if(age<=26)return 1; if(age<=29)return 0; if(age<=32)return -1; if(age<=36)return -2; return -3; }
function clamp(x,a,b){return x<a?a:(x>b?b:x);}
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1));}

function nextSeason(){
  ageRosters();
  state.year++;
  state.schedule=buildSchedule();
  state.gameIdx=0;
  state.phase="regular";
  state.postseason=null;
  state.champion=null;
  state.pendingGame=null;
  K.TEAM_IDS.forEach(t=>{ state.season[t]={W:0,L:0,T:0,RF:0,RA:0,bat:{},pit:{}}; });
  // re-validate cfgs (players persist; ratings changed). Keep user's lineup if all exist.
  K.TEAM_IDS.forEach(t=>{
    const d=K.defaultLineup(t);
    const c=state.cfgs[t];
    const validB = K.ROSTERS[t].batters.map(b=>b.n);
    const validP = K.ROSTERS[t].pitchers.map(p=>p.n);
    if(t!==USER){ state.cfgs[t]={teamId:t,lineup:d.lineup.slice(),rotation:d.rotation.slice(),bullpen:d.bullpen.slice(),closer:d.closer}; }
    else {
      c.lineup=c.lineup.filter(n=>validB.includes(n)); while(c.lineup.length<9){ const add=d.lineup.find(n=>!c.lineup.includes(n)); if(!add)break; c.lineup.push(add);} c.lineup=c.lineup.slice(0,9);
      c.rotation=c.rotation.filter(n=>validP.includes(n)); if(c.rotation.length<5){ d.rotation.forEach(n=>{if(!c.rotation.includes(n)&&c.rotation.length<5)c.rotation.push(n);}); }
      c.bullpen=c.bullpen.filter(n=>validP.includes(n)); if(!validP.includes(c.closer))c.closer=d.closer;
    }
  });
  teamGameCount={}; K.TEAM_IDS.forEach(t=>teamGameCount[t]=0);
  closeModal(); currentTab="dash"; render();
}

const TABS=[["dash","🏠 대시보드"],["squad","👥 스쿼드"],["lineup","📋 라인업"],["sched","📅 일정/경기"],["stand","🏆 순위"],["leaders","📊 기록실"],["trade","🔁 트레이드"]];

function render(){
  autosave();
  // header
  $("teaminfo").innerHTML = `${teamDot(USER)} <b>${K.ROSTERS[USER].name}</b> · ${state.year} 시즌 · ${phaseLabel()}`;
  // tabs
  $("tabs").innerHTML = TABS.map(([id,lbl])=>`<button class="${currentTab===id?'active':''}" onclick="App.tab('${id}')">${lbl}</button>`).join("");
  const v=$("view");
  if(currentTab==="dash") v.innerHTML=renderDash();
  else if(currentTab==="squad") v.innerHTML=renderSquad();
  else if(currentTab==="lineup") v.innerHTML=renderLineup();
  else if(currentTab==="sched") v.innerHTML=renderSched();
  else if(currentTab==="stand") v.innerHTML=renderStand();
  else if(currentTab==="leaders") v.innerHTML=renderLeaders();
  else if(currentTab==="trade") v.innerHTML=renderTrade();
}
function phaseLabel(){
  if(state.phase==="regular"){ const played=state.schedule.slice(0,state.gameIdx).filter(g=>g.home===USER||g.away===USER).length; return `정규시즌 ${played}/${SEASON_GAMES}경기`; }
  if(state.phase==="postseason") return "포스트시즌";
  return "오프시즌 🏆"+(state.champion?` ${K.ROSTERS[state.champion].name} 우승`:"");
}

function renderDash(){
  const st=standings();
  const me=st.find(x=>x.t===USER); const rank=st.findIndex(x=>x.t===USER)+1;
  const userGames=state.schedule.filter(g=>g.home===USER||g.away===USER);
  const recent=userGames.filter(g=>g.played).slice(-5).reverse();
  const next=userGames.find(g=>!g.played);
  let recentHtml = recent.length? recent.map(g=>{
    const opp=g.home===USER?g.away:g.home; const us=g.home===USER?g.hr:g.ar; const them=g.home===USER?g.ar:g.hr;
    const w=us>them, t=us===them;
    return `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0">
      <span>${g.home===USER?'vs':'@'} ${teamDot(opp)} ${opp}</span>
      <span class="${t?'muted':(w?'win':'lose')}"><b>${t?'무':(w?'승':'패')}</b> ${us}:${them}</span></div>`;
  }).join("") : `<div class="muted">아직 경기 없음</div>`;

  const ctrl = state.phase==="regular" ? `
    <div class="row">
      <button class="btn primary" onclick="App.nextGame()">▶ 다음 경기 (프리뷰→중계)</button>
      <button class="btn" onclick="App.userGames(5)">⏩ 5경기 빠르게</button>
      <button class="btn" onclick="App.userGames(20)">⏩⏩ 20경기</button>
      <button class="btn" onclick="App.simRest()">⏭ 시즌 끝까지</button>
    </div>`
    : state.phase==="postseason" ? `<button class="btn gold" onclick="App.showPS()">🏆 포스트시즌 결과 보기</button>`
    : `<div class="row"><button class="btn gold" onclick="App.showPS()">🏆 시즌 결과</button><button class="btn primary" onclick="App.nextSeason()">➡ 다음 시즌 시작</button></div>`;

  const nextHtml = next ? `<div class="scoreboard">
      <div class="t">${teamDot(next.home)}<div><b>${next.home}</b></div><div class="muted" style="font-size:11px">${next.home===USER?'우리':K.ROSTERS[next.home].name}</div></div>
      <div class="muted">VS</div>
      <div class="t">${teamDot(next.away)}<div><b>${next.away}</b></div><div class="muted" style="font-size:11px">${next.away===USER?'우리':K.ROSTERS[next.away].name}</div></div>
    </div>` : `<div class="muted" style="text-align:center;padding:14px">정규시즌 종료</div>`;

  const miniStand = st.map((x,i)=>`<tr class="rankrow ${x.t===USER?'me':''}">
     <td>${i+1}</td><td class="name">${teamDot(x.t)} ${x.t}</td><td>${x.W}</td><td>${x.L}</td><td>${x.T}</td><td>${fmtAvg(x.pct)}</td></tr>`).join("");

  // team leaders
  const myBat=Object.entries(state.season[USER].bat).map(([n,s])=>({n,s})).filter(x=>x.s.AB>0);
  const topAvg=myBat.slice().sort((a,b)=> (b.s.H/b.s.AB)-(a.s.H/a.s.AB))[0];
  const topHR=myBat.slice().sort((a,b)=>b.s.HR-a.s.HR)[0];
  const topRBI=myBat.slice().sort((a,b)=>b.s.RBI-a.s.RBI)[0];

  return `
  <div class="grid cols3">
    <div class="card"><h3>다음 경기 <span class="tag">${state.year} 시즌</span></h3>${nextHtml}<div style="margin-top:12px">${ctrl}</div>
      <div class="progress"><i style="width:${Math.round(state.gameIdx/state.schedule.length*100)}%"></i></div>
    </div>
    <div class="card"><h3>팀 순위</h3>
      <div class="big" style="color:${rank<=5?'var(--good)':'var(--dim)'}">${rank}위 <span style="font-size:14px" class="muted">/ 10팀</span></div>
      <div class="muted">${me.W}승 ${me.L}패 ${me.T}무 · 승률 ${fmtAvg(me.pct)}</div>
      <div class="muted" style="margin-top:4px">득점 ${me.RF} / 실점 ${me.RA} (${me.diff>=0?'+':''}${me.diff})</div>
      <div class="hint" style="margin-top:8px">${rank<=5?'현재 가을야구 진출권 ✅':'5위 안에 들어야 포스트시즌 진출'}</div>
    </div>
    <div class="card"><h3>최근 경기</h3>${recentHtml}</div>
  </div>
  <div class="grid cols2" style="margin-top:14px">
    <div class="card"><h3>리그 순위표</h3>
      <table><thead><tr><th>순위</th><th class="name">팀</th><th>승</th><th>패</th><th>무</th><th>승률</th></tr></thead><tbody>${miniStand}</tbody></table>
    </div>
    <div class="card"><h3>우리 팀 리더</h3>
      ${topAvg? `<div class="kpi">
        <div class="k"><div class="v">${fmtAvg(topAvg.s.H/topAvg.s.AB)}</div><div class="l">타율 1위 · ${topAvg.n}</div></div>
        <div class="k"><div class="v">${topHR.s.HR}</div><div class="l">홈런 1위 · ${topHR.n}</div></div>
        <div class="k"><div class="v">${topRBI.s.RBI}</div><div class="l">타점 1위 · ${topRBI.n}</div></div>
      </div>`:'<div class="muted">시즌 진행 후 표시됩니다.</div>'}
      <div class="hint" style="margin-top:10px">💡 라인업·로테이션을 직접 짜고, 트레이드로 약점을 보강하세요. 김도영을 중심으로 한 타선과 네일·양현종 원투펀치로 가을야구에 도전!</div>
    </div>
  </div>`;
}

function batRow(team,p,showStat){
  const s=state.season[team].bat[p.n];
  const o=K.ovr(p);
  let stat="";
  if(showStat){
    if(s&&s.AB>0) stat=`<td>${s.G}</td><td>${s.AB}</td><td>${s.H}</td><td>${s.HR}</td><td>${s.RBI}</td><td>${s.R}</td><td>${s.BB}</td><td>${s.SO}</td><td><b>${fmtAvg(s.H/s.AB)}</b></td><td>${fmtAvg((s.H+s.BB+s.HBP)/(s.AB+s.BB+s.HBP))}</td>`;
    else stat=`<td colspan="10" class="muted">기록 없음</td>`;
  }
  return `<tr><td class="name">${pname(team,p.n)}</td><td><span class="pill pos">${p.pos}</span></td><td>${p.age}</td>
    <td><span class="ovr ${ovrClass(o)}">${o}</span></td>
    <td>${ratNum(p.con)}</td><td>${ratNum(p.pow)}</td><td>${ratNum(p.eye)}</td><td>${ratNum(p.spd)}</td><td>${ratNum(p.fld)}</td><td>${ratNum(p.arm)}</td>${stat}</tr>`;
}
function pitRow(team,p,showStat){
  const s=state.season[team].pit[p.n]; const o=K.ovr(p);
  let stat="";
  if(showStat){
    if(s&&s.G>0) stat=`<td>${s.G}</td><td>${s.GS}</td><td>${s.W}</td><td>${s.L}</td><td>${s.SV}</td><td>${ipStr(s.OUT)}</td><td>${s.SO}</td><td>${s.BB}</td><td><b>${fmtEra(s.ER,s.OUT)}</b></td>`;
    else stat=`<td colspan="9" class="muted">기록 없음</td>`;
  }
  return `<tr><td class="name">${pname(team,p.n)}</td><td><span class="pill pos">${p.role}</span></td><td>${p.age}</td>
    <td><span class="ovr ${ovrClass(o)}">${o}</span></td>
    <td>${ratNum(p.stu)}</td><td>${ratNum(p.ctl)}</td><td>${ratNum(p.mov)}</td><td>${ratNum(p.sta)}</td>${stat}</tr>`;
}
let squadView="bat";
function renderSquad(){
  const r=K.ROSTERS[USER];
  const tabs=`<div class="tabsm">
    <button class="${squadView==='bat'?'active':''}" onclick="App.squadView('bat')">타자</button>
    <button class="${squadView==='pit'?'active':''}" onclick="App.squadView('pit')">투수</button></div>`;
  let body;
  if(squadView==="bat"){
    const rows=r.batters.slice().sort((a,b)=>K.ovr(b)-K.ovr(a)).map(p=>batRow(USER,p,true)).join("");
    body=`<table><thead><tr><th class="name">선수</th><th>POS</th><th>나이</th><th>OVR</th>
      <th>컨택</th><th>파워</th><th>선구</th><th>주력</th><th>수비</th><th>송구</th>
      <th>G</th><th>AB</th><th>H</th><th>HR</th><th>타점</th><th>득점</th><th>BB</th><th>SO</th><th>타율</th><th>출루</th></tr></thead><tbody>${rows}</tbody></table>`;
  } else {
    const rows=r.pitchers.slice().sort((a,b)=>K.ovr(b)-K.ovr(a)).map(p=>pitRow(USER,p,true)).join("");
    body=`<table><thead><tr><th class="name">선수</th><th>보직</th><th>나이</th><th>OVR</th>
      <th>구위</th><th>제구</th><th>무브</th><th>체력</th>
      <th>G</th><th>GS</th><th>W</th><th>L</th><th>SV</th><th>IP</th><th>SO</th><th>BB</th><th>ERA</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  return `<div class="card"><h3>${r.name} 스쿼드 <span class="tag">능력치 40~99 · 선수 이름 클릭 시 상세 프로필</span></h3>${tabs}${body}</div>`;
}

function renderLineup(){
  const c=state.cfgs[USER]; const r=K.ROSTERS[USER];
  const batOpts=(sel)=>r.batters.map(b=>`<option value="${b.n}" ${b.n===sel?'selected':''}>${b.n} (${b.pos}·${K.ovr(b)})</option>`).join("");
  const lineupRows=c.lineup.map((n,i)=>{
    const b=K.ROSTERS[USER].batters.find(x=>x.n===n);
    return `<tr><td><b>${i+1}</b></td>
      <td class="name"><select onchange="App.setLineup(${i},this.value)">${batOpts(n)}</select></td>
      <td><span class="pill pos">${b?b.pos:'-'}</span></td>
      <td>컨${b?b.con:'-'} / 파${b?b.pow:'-'} / 선${b?b.eye:'-'} / 주${b?b.spd:'-'}</td></tr>`;
  }).join("");

  const sp=r.pitchers.filter(p=>p.role==="SP");
  const pitOpts=(sel,pool)=>pool.map(p=>`<option value="${p.n}" ${p.n===sel?'selected':''}>${p.n} (${K.ovr(p)})</option>`).join("");
  const rotRows=c.rotation.map((n,i)=>`<tr><td>선발 ${i+1}</td>
    <td class="name"><select onchange="App.setRotation(${i},this.value)">${pitOpts(n,sp)}</select></td>
    <td>${(()=>{const p=K.getP(USER,n);return p?`구위${p.stu}/제구${p.ctl}/체력${p.sta}`:'';})()}</td></tr>`).join("");

  const allPit=r.pitchers;
  const closerSel=`<select onchange="App.setCloser(this.value)">${allPit.filter(p=>p.role!=="SP").map(p=>`<option value="${p.n}" ${p.n===c.closer?'selected':''}>${p.n} (${K.ovr(p)})</option>`).join("")}</select>`;

  const banner = state.pendingGame!=null ? (()=>{ const g=state.schedule[state.pendingGame]; const opp=g.home===USER?g.away:g.home;
    return `<div class="card" style="border-color:var(--accent);background:rgba(234,0,41,.08);margin-bottom:14px">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div><b>⚾ 경기 대기 중</b> — ${g.home===USER?'vs':'@'} ${K.ROSTERS[opp].name}. 라인업/선발을 확정한 뒤 제출하세요.</div>
        <button class="btn primary" onclick="App.startMatch()">✅ 엔트리 제출 & 경기 시작</button>
      </div></div>`; })() : '';
  return banner + `<div class="grid cols2">
    <div class="card"><h3>타순 (1~9번) <span class="tag">자동 최적화 가능</span></h3>
      <table><thead><tr><th>순서</th><th class="name">선수</th><th>POS</th><th>주요능력</th></tr></thead><tbody>${lineupRows}</tbody></table>
      <button class="btn" style="margin-top:10px" onclick="App.autoLineup()">🤖 자동 추천 라인업</button>
    </div>
    <div class="card"><h3>선발 로테이션</h3>
      <table><thead><tr><th>순번</th><th class="name">투수</th><th>능력</th></tr></thead><tbody>${rotRows}</tbody></table>
      <h3 style="margin-top:18px">마무리 투수</h3>
      <div class="row">${closerSel}</div>
      <div class="hint" style="margin-top:10px">불펜은 능력치 순으로 자동 운용됩니다. 선발이 지치거나 5실점 이상 시 교체, 9회 1~3점 차 리드 시 마무리가 등판합니다.</div>
    </div>
  </div>`;
}

function renderSched(){
  // group by day, show window around current
  const userGames=state.schedule.map((g,idx)=>({g,idx})).filter(x=>x.g.home===USER||x.g.away===USER);
  const rows=userGames.map(x=>{
    const g=x.g; const opp=g.home===USER?g.away:g.home; const homeAway=g.home===USER?'홈':'원정';
    let result="-";
    if(g.played){ const us=g.home===USER?g.hr:g.ar, them=g.home===USER?g.ar:g.hr; const w=us>them,t=us===them;
      result=`<span class="${t?'muted':(w?'win':'lose')}"><b>${t?'무':(w?'승':'패')}</b> ${us}:${them}</span>`; }
    const isNext = !g.played && (state.schedule.findIndex(s=>!s.played&&(s.home===USER||s.away===USER))===x.idx);
    return `<tr style="${isNext?'background:rgba(234,0,41,.12)':''}"><td>${Math.floor(userGames.indexOf(x))+1}</td>
      <td>${homeAway}</td><td class="name">${teamDot(opp)} ${K.ROSTERS[opp].name}</td><td>${result}</td>${isNext?'<td>▶ 다음</td>':'<td></td>'}</tr>`;
  }).join("");
  const ctrl = state.phase==="regular"?`<div class="row" style="margin-bottom:12px">
    <button class="btn primary" onclick="App.nextGame()">▶ 다음 경기</button>
    <button class="btn" onclick="App.userGames(5)">5경기</button>
    <button class="btn" onclick="App.userGames(20)">20경기</button>
    <button class="btn" onclick="App.simRest()">시즌 끝까지</button></div>`:'';
  return `<div class="card"><h3>KIA 타이거즈 일정 <span class="tag">144경기</span></h3>${ctrl}
    <div style="max-height:620px;overflow:auto">
    <table><thead><tr><th>#</th><th>구분</th><th class="name">상대</th><th>결과</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function renderStand(){
  const st=standings();
  const rows=st.map((x,i)=>`<tr class="rankrow ${x.t===USER?'me':''}">
    <td><b>${i+1}</b></td><td class="name">${teamDot(x.t)} ${K.ROSTERS[x.t].name}</td>
    <td>${x.gp}</td><td>${x.W}</td><td>${x.L}</td><td>${x.T}</td><td><b>${fmtAvg(x.pct)}</b></td>
    <td>${i===0?'-':gb(st[0],x)}</td><td>${x.RF}</td><td>${x.RA}</td><td>${x.diff>=0?'+':''}${x.diff}</td>
    <td>${i<5?'<span class="pill" style="background:rgba(54,194,117,.2);color:var(--good)">PS</span>':''}</td></tr>`).join("");
  return `<div class="card"><h3>${state.year} 정규시즌 순위 <span class="tag">상위 5팀 가을야구</span></h3>
    <table><thead><tr><th>순위</th><th class="name">팀</th><th>경기</th><th>승</th><th>패</th><th>무</th><th>승률</th><th>게임차</th><th>득점</th><th>실점</th><th>득실</th><th>PS</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function gb(top,x){ return ((top.W-x.W)+(x.L-top.L))/2 ? (((top.W-x.W)+(x.L-top.L))/2).toFixed(1):'-'; }

let leaderCat="avg";
function renderLeaders(){
  const cats=[["avg","타율"],["hr","홈런"],["rbi","타점"],["r","득점"],["h","안타"],["era","평균자책"],["w","다승"],["so","탈삼진"],["sv","세이브"]];
  const tabs=`<div class="tabsm">${cats.map(([id,l])=>`<button class="${leaderCat===id?'active':''}" onclick="App.leaderCat('${id}')">${l}</button>`).join("")}</div>`;
  // gather
  let bat=[],pit=[];
  K.TEAM_IDS.forEach(t=>{
    for(const n in state.season[t].bat){ const s=state.season[t].bat[n]; bat.push({t,n,s}); }
    for(const n in state.season[t].pit){ const s=state.season[t].pit[n]; pit.push({t,n,s}); }
  });
  const minAB = Math.max(20, state.gameIdx/state.schedule.length*144*2.7);
  const minOut = Math.max(30, state.gameIdx/state.schedule.length*144*0.9);
  let rows="",head="";
  function brow(x,val,extra){return `<tr class="${x.t===USER?'me rankrow':''}"><td>${x.rank}</td><td class="name">${teamDot(x.t)} ${pname(x.t,x.n)}</td><td class="muted">${x.t}</td><td><b>${val}</b></td>${extra||''}</tr>`;}
  if(["avg","hr","rbi","r","h"].includes(leaderCat)){
    let arr=bat.filter(x=>x.s.AB>0);
    if(leaderCat==="avg"){ arr=arr.filter(x=>x.s.AB>=minAB).sort((a,b)=>(b.s.H/b.s.AB)-(a.s.H/a.s.AB));
      head=`<th>타율</th><th>AB</th><th>H</th><th>HR</th>`;
      rows=arr.slice(0,15).map((x,i)=>{x.rank=i+1;return brow(x,fmtAvg(x.s.H/x.s.AB),`<td>${x.s.AB}</td><td>${x.s.H}</td><td>${x.s.HR}</td>`);}).join("");}
    else { const key={hr:"HR",rbi:"RBI",r:"R",h:"H"}[leaderCat]; arr=arr.sort((a,b)=>b.s[key]-a.s[key]);
      head=`<th>${{hr:'홈런',rbi:'타점',r:'득점',h:'안타'}[leaderCat]}</th><th>타율</th><th>HR</th><th>타점</th>`;
      rows=arr.slice(0,15).map((x,i)=>{x.rank=i+1;return brow(x,x.s[key],`<td>${fmtAvg(x.s.H/x.s.AB)}</td><td>${x.s.HR}</td><td>${x.s.RBI}</td>`);}).join("");}
  } else {
    let arr=pit.filter(x=>x.s.G>0);
    if(leaderCat==="era"){ arr=arr.filter(x=>x.s.OUT>=minOut).sort((a,b)=>(a.s.ER/a.s.OUT)-(b.s.ER/b.s.OUT));
      head=`<th>ERA</th><th>IP</th><th>W</th><th>SO</th>`;
      rows=arr.slice(0,15).map((x,i)=>{x.rank=i+1;return brow(x,fmtEra(x.s.ER,x.s.OUT),`<td>${ipStr(x.s.OUT)}</td><td>${x.s.W}</td><td>${x.s.SO}</td>`);}).join("");}
    else { const key={w:"W",so:"SO",sv:"SV"}[leaderCat]; arr=arr.sort((a,b)=>b.s[key]-a.s[key]);
      head=`<th>${{w:'승',so:'탈삼진',sv:'세이브'}[leaderCat]}</th><th>ERA</th><th>IP</th><th>SO</th>`;
      rows=arr.slice(0,15).map((x,i)=>{x.rank=i+1;return brow(x,x.s[key],`<td>${fmtEra(x.s.ER,x.s.OUT)}</td><td>${ipStr(x.s.OUT)}</td><td>${x.s.SO}</td>`);}).join("");}
  }
  return `<div class="card"><h3>리그 기록실 <span class="tag">${state.year} 시즌</span></h3>${tabs}
    <table><thead><tr><th>순위</th><th class="name">선수</th><th>팀</th>${head}</tr></thead><tbody>${rows||'<tr><td colspan="7" class="muted">기록 없음 — 경기를 진행하세요</td></tr>'}</tbody></table></div>`;
}

// ---------- trade ----------
let tradeOut=new Set(), tradeTeam=null, tradeIn=new Set();
function playerValue(p){
  const o=K.ovr(p);
  const ageAdj = p.age<=25? 6 : p.age<=28? 3 : p.age<=31?0 : p.age<=34?-4 : -9;
  return o + ageAdj;
}
function renderTrade(){
  const teams=K.TEAM_IDS.filter(t=>t!==USER);
  if(!tradeTeam) tradeTeam=teams[0];
  const myAll=[...K.ROSTERS[USER].batters,...K.ROSTERS[USER].pitchers].sort((a,b)=>K.ovr(b)-K.ovr(a));
  const themAll=[...K.ROSTERS[tradeTeam].batters,...K.ROSTERS[tradeTeam].pitchers].sort((a,b)=>K.ovr(b)-K.ovr(a));
  const itemOut=p=>`<label class="checkitem"><input type="checkbox" ${tradeOut.has(p.n)?'checked':''} onchange="App.toggleOut('${p.n}')">
    <span class="ovr ${ovrClass(K.ovr(p))}">${K.ovr(p)}</span> ${p.n} <span class="muted">${p.pos||p.role}·${p.age}세</span></label>`;
  const itemIn=p=>`<label class="checkitem"><input type="checkbox" ${tradeIn.has(p.n)?'checked':''} onchange="App.toggleIn('${p.n}')">
    <span class="ovr ${ovrClass(K.ovr(p))}">${K.ovr(p)}</span> ${p.n} <span class="muted">${p.pos||p.role}·${p.age}세</span></label>`;
  const outVal=[...tradeOut].reduce((a,n)=>a+playerValue(findPlayer(USER,n)),0);
  const inVal=[...tradeIn].reduce((a,n)=>a+playerValue(findPlayer(tradeTeam,n)),0);
  const accept = inVal>0 && outVal>=inVal*0.98;
  return `<div class="card"><h3>트레이드 <span class="tag">상대팀 선택 후 선수 교환</span></h3>
    <div class="row" style="margin-bottom:10px">상대팀: <select onchange="App.tradeTeam(this.value)">${teams.map(t=>`<option value="${t}" ${t===tradeTeam?'selected':''}>${K.ROSTERS[t].name}</option>`).join("")}</select></div>
    <div class="row" style="align-items:flex-start">
      <div class="trade-side"><b>내보낼 선수 (KIA)</b><div style="max-height:340px;overflow:auto;margin-top:6px">${myAll.map(itemOut).join("")}</div>
        <div style="margin-top:6px">가치 합계: <b>${outVal}</b></div></div>
      <div class="trade-side"><b>받을 선수 (${tradeTeam})</b><div style="max-height:340px;overflow:auto;margin-top:6px">${themAll.map(itemIn).join("")}</div>
        <div style="margin-top:6px">가치 합계: <b>${inVal}</b></div></div>
    </div>
    <div class="deal-result ${accept?'deal-ok':'deal-no'}">${
      tradeIn.size===0&&tradeOut.size===0? '교환할 선수를 선택하세요.' :
      accept? '✅ 상대가 받아들일 만한 제안입니다. 트레이드를 실행하세요!' :
      '❌ 상대팀이 거절할 제안입니다. 더 좋은 카드를 제시하세요 (받을 가치 ≤ 내줄 가치).'}</div>
    <button class="btn primary" ${accept?'':'disabled'} onclick="App.execTrade()">🤝 트레이드 실행</button>
    <div class="hint" style="margin-top:8px">선수 가치 = 능력치(OVR) + 나이 보정(어릴수록 +). 트레이드 후 라인업은 자동 재구성되니 라인업 탭에서 확인하세요.</div>
  </div>`;
}
function findPlayer(team,n){ return K.ROSTERS[team].batters.find(x=>x.n===n)||K.ROSTERS[team].pitchers.find(x=>x.n===n); }
function execTrade(){
  const fromUser=[...tradeOut], fromThem=[...tradeIn];
  function move(srcT,dstT,name){
    const r=K.ROSTERS[srcT]; let i=r.batters.findIndex(x=>x.n===name);
    if(i>=0){ const p=r.batters.splice(i,1)[0]; K.ROSTERS[dstT].batters.push(p); return; }
    i=r.pitchers.findIndex(x=>x.n===name);
    if(i>=0){ const p=r.pitchers.splice(i,1)[0]; K.ROSTERS[dstT].pitchers.push(p); }
  }
  fromUser.forEach(n=>move(USER,tradeTeam,n));
  fromThem.forEach(n=>move(tradeTeam,USER,n));
  // rebuild cfgs for both
  [USER,tradeTeam].forEach(t=>{ const d=K.defaultLineup(t); state.cfgs[t]={teamId:t,lineup:d.lineup.slice(),rotation:d.rotation.slice(),bullpen:d.bullpen.slice(),closer:d.closer}; });
  tradeOut.clear(); tradeIn.clear();
  alert("트레이드 완료! 라인업이 자동 재구성되었습니다.");
  render();
}

// ---------- save / load ----------
// Manual save and autosave use separate slots, so autosave never overwrites the manual one.
const SAVE_KEY='kbo_manager_save', AUTOSAVE_KEY='kbo_manager_autosave', SAVE_VERSION=1;
function saveData(){ return JSON.stringify({ v:SAVE_VERSION, savedAt:Date.now(), state, teamGameCount, rosters:K.ROSTERS }); }
function applySave(data){
  // restore rosters in place
  for(const t in data.rosters){ K.ROSTERS[t].batters=data.rosters[t].batters; K.ROSTERS[t].pitchers=data.rosters[t].pitchers; K.ROSTERS[t].color=data.rosters[t].color; }
  state=data.state; teamGameCount=data.teamGameCount; state.pendingGame=null;
}
function autosave(){
  if(!state) return;
  try{ localStorage.setItem(AUTOSAVE_KEY, saveData()); }catch(e){ console.warn('자동저장 실패', e); }
}
function restoreAutosave(){
  try{
    const raw=localStorage.getItem(AUTOSAVE_KEY);
    if(!raw) return false;
    const data=JSON.parse(raw);
    if((data.v||0)>SAVE_VERSION) return false; // written by a newer version of the game
    applySave(data); return true;
  }catch(e){ console.warn('자동저장 복구 실패', e); return false; }
}
function save(){
  try{
    localStorage.setItem(SAVE_KEY, saveData());
    alert('저장 완료! (이 브라우저에 저장됨)');
  }catch(e){ alert('저장 실패: '+e.message); }
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw){ alert('저장된 게임이 없습니다.'); return; }
    applySave(JSON.parse(raw));
    const ro=document.getElementById('relay'); if(ro)ro.remove();
    closeModal(); currentTab="dash"; render();
    alert('불러오기 완료!');
  }catch(e){ alert('불러오기 실패: '+e.message); }
}
function confirmNew(){ if(confirm('새 게임을 시작하면 현재 진행 상황이 사라집니다. (저장은 유지됩니다) 계속할까요?')){ try{ localStorage.removeItem(AUTOSAVE_KEY); }catch(e){} location.reload(); } }

// ---------- self test (dev) ----------
function selfTest(){
  // quick: clone-free quick season using default cfgs into temp accumulators
  const tmp={}; K.TEAM_IDS.forEach(t=>tmp[t]={bat:{},pit:{},RF:0});
  const cfg={}; K.TEAM_IDS.forEach(t=>{const d=K.defaultLineup(t);cfg[t]={teamId:t,lineup:d.lineup,bullpen:d.bullpen,closer:d.closer,rotation:d.rotation};});
  const gc={};K.TEAM_IDS.forEach(t=>gc[t]=0);
  const rr=roundRobin(K.TEAM_IDS); let games=0;
  for(let c=0;c<16;c++) rr.forEach(pairs=>pairs.forEach(p=>{
    const home=c%2?p[1]:p[0], away=c%2?p[0]:p[1];
    const hc=Object.assign({},cfg[home],{spName:cfg[home].rotation[gc[home]%5]}); gc[home]++;
    const ac=Object.assign({},cfg[away],{spName:cfg[away].rotation[gc[away]%5]}); gc[away]++;
    const res=K.simGame(hc,ac,{}); games++;
    [home,away].forEach(t=>{ for(const n in res.box[t].bat){const s=res.box[t].bat[n];const x=tmp[t].bat[n]||(tmp[t].bat[n]=K.newBatStat());for(const k in s)x[k]+=s[k];}
      for(const n in res.box[t].pit){const s=res.box[t].pit[n];const x=tmp[t].pit[n]||(tmp[t].pit[n]=K.newPitStat());for(const k in s)x[k]+=s[k];}});
    tmp[home].RF+=res.homeRuns; tmp[away].RF+=res.awayRuns;
  }));
  let AB=0,H=0,HR=0,BB=0,SO=0,PA=0,ER=0,OUT=0,RUN=0;
  K.TEAM_IDS.forEach(t=>{ for(const n in tmp[t].bat){const s=tmp[t].bat[n];AB+=s.AB;H+=s.H;HR+=s.HR;BB+=s.BB;SO+=s.SO;PA+=s.PA;}
    for(const n in tmp[t].pit){const s=tmp[t].pit[n];ER+=s.ER;OUT+=s.OUT;} RUN+=tmp[t].RF; });
  const msg=`[엔진 검증 · ${games}경기]\n리그 타율: ${fmtAvg(H/AB)}\n리그 ERA: ${(ER*9/(OUT/3)).toFixed(2)}\n경기당 팀 득점: ${(RUN/games).toFixed(2)}\n총 홈런: ${HR} (경기당 ${(HR/games).toFixed(2)})\nK%: ${(SO/PA*100).toFixed(1)}  BB%: ${(BB/PA*100).toFixed(1)}`;
  alert(msg); console.log(msg);
}

  nextSeason:nextSeason,
  closeModal:closeModal,
  save:save, load:load, confirmNew:confirmNew, selfTest:selfTest
};
window.App=App;
window.Match=Match;

// ---------- boot ----------
function boot(){
  if(!K){ document.getElementById('view').innerHTML='<div class="card">엔진(core.js) 로드 실패. core.js가 같은 폴더에 있는지 확인하세요.</div>'; return; }
  initState();
  restoreAutosave(); // pick up where the last session left off (refresh, closed tab)
  render();
}
boot();
</script>
</body>
</html>
