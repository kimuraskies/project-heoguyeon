<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBO 매니저 2026 — 한국프로야구 매니지먼트</title>
<style>
:root{
  /* design pass 1 (design/tokens.css): broadcast navy surfaces, club theme via data-team */
  --bg:#090f19; --panel:#111c2b; --panel2:#19283b; --hero:#132237; --line:#2c3c52; --line-strong:#42546d;
  --txt:#f2f6fc; --dim:#b0bfd2; --accent:#ea0029; --accent2:#ffd200;
  --good:#7de1af; --warn:#ffcf7a; --bad:#ff9caa; --blue:#99cdff;
  --team:#ea0029; --team-ink:#ff9aab; --on-team:#fff;
  color-scheme:dark; /* single dark look: native controls and scrollbars match */
}
:root[data-team="KIA"]{--team:#ea0029;--team-ink:#ff9aab;--on-team:#fff}
:root[data-team="LG"]{--team:#c30452;--team-ink:#ff9fc4;--on-team:#fff}
:root[data-team="한화"]{--team:#fc4e00;--team-ink:#ffb08a;--on-team:#090f19}
:root[data-team="SSG"]{--team:#ce0e2d;--team-ink:#ff9aaa;--on-team:#fff}
:root[data-team="삼성"]{--team:#074ca1;--team-ink:#98c8ff;--on-team:#fff}
:root[data-team="NC"]{--team:#315288;--team-ink:#abcaff;--on-team:#fff}
:root[data-team="KT"]{--team:#000000;--team-ink:#e0e8f5;--on-team:#fff}
:root[data-team="롯데"]{--team:#041e42;--team-ink:#9ec9ff;--on-team:#fff}
:root[data-team="두산"]{--team:#1a1748;--team-ink:#c4bdff;--on-team:#fff}
:root[data-team="키움"]{--team:#570514;--team-ink:#ffafbd;--on-team:#fff}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;}
#app{max-width:1200px;margin:0 auto;padding-block:0 60px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
.teamdot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;box-shadow:0 0 0 1px #ffffff40;}
.btn{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.btn:hover{border-color:var(--team-ink);}
.btn.primary{background:var(--team);color:var(--on-team);border-color:var(--team-ink);}
.btn.primary:hover{filter:brightness(1.1);}
.btn.gold{background:var(--accent2);color:#222;border-color:var(--accent2);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.grid{display:grid;gap:14px;}
.cols2{grid-template-columns:1fr 1fr;}
.cols3{grid-template-columns:repeat(3,1fr);}
@media(max-width:820px){.cols2,.cols3{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto;} /* wide tables scroll inside the card on phones */
.grid>*{min-width:0;}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;}
.card h3 .tag{font-size:11px;color:var(--dim);font-weight:500;margin-left:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;cursor:default;}
td.name,th.name{text-align:left;}
tr:hover td{background:rgba(255,255,255,.03);}
.pill{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;}
.pos{background:var(--panel2);color:var(--dim);}
.ovr{font-weight:800;}
.ovr.s90{color:#ffd200;} .ovr.s80{color:#36c275;} .ovr.s70{color:#7fd0ff;} .ovr.s60{color:var(--txt);} .ovr.s0{color:var(--dim);}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;display:inline-block;width:46px;vertical-align:middle;}
.bar>i{display:block;height:100%;}
.muted{color:var(--dim);}
.big{font-size:28px;font-weight:800;}
.scoreboard{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 0;}
.scoreboard .t{text-align:center;min-width:90px;}
.scoreboard .sc{font-size:40px;font-weight:800;}
.win{color:var(--good);}
.lose{color:var(--dim);}
select,input{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;padding:20px;}
.modal h2{margin:0 0 4px;}
.closeX{float:right;cursor:pointer;color:var(--dim);font-size:22px;line-height:1;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.linescore td,.linescore th{padding:4px 6px;font-size:12px;}
.kpi{display:flex;gap:18px;flex-wrap:wrap;}
.kpi .k{background:var(--panel2);border-radius:10px;padding:10px 14px;min-width:90px;}
.kpi .k .v{font-size:22px;font-weight:800;}
.kpi .k .l{font-size:11px;color:var(--dim);}
.hint{font-size:12px;color:var(--dim);line-height:1.6;}
.rankrow.me{background:#ffffff0a;color:var(--team-ink);}
.tabsm{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap;}
.tabsm button{font-size:12px;padding:5px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--dim);cursor:pointer;}
.tabsm button.active{background:var(--accent);color:#fff;}
.progress{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:6px;}
.progress>i{display:block;height:100%;background:var(--accent);}
.trade-side{flex:1;min-width:240px;}
.checkitem{display:flex;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid var(--line);font-size:13px;}
.checkitem:hover{background:rgba(255,255,255,.03);}
.deal-result{padding:10px;border-radius:8px;margin-top:10px;font-weight:600;}
.deal-ok{background:rgba(54,194,117,.15);color:var(--good);}
.deal-no{background:rgba(224,85,106,.15);color:var(--bad);}
footer{text-align:center;color:var(--dim);font-size:11px;margin-top:30px;line-height:1.7;}
/* live relay broadcast view */
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0 10px}
.mu-side{display:flex;align-items:center;gap:8px;min-width:0}
.mu-p{justify-content:flex-end;text-align:right}
.mu-txt{min-width:0;font-size:14px}
.mu-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-sub{font-size:11.5px;color:var(--dim);margin-top:3px;white-space:nowrap}
.mu-sub .ovr{font-size:11.5px}
.mu-tag{display:inline-block;color:#fff;font-size:11px;font-weight:800;border-radius:4px;padding:1px 4px;margin-right:5px;vertical-align:1px}
.mu-vs{color:var(--dim);font-weight:800;font-size:16px;opacity:.55;letter-spacing:1px}
.bc{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.bc-cap{padding:11px 12px;font-size:14px;background:var(--panel2);min-height:74px}
.cm-now{font-size:15px;font-weight:700;line-height:1.45;transform-origin:left center}
.cm-quiet{color:var(--txt);font-weight:600}
.cm-tense{color:var(--accent2)}
.cm-big{color:var(--accent2);font-size:17px;font-weight:800;animation:cmPop .45s ease-out}
.cm-prev{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.4}
@keyframes cmPop{0%{transform:scale(.94);opacity:.3}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.cm-big{animation:none}}
.wp{padding:10px 12px 8px;border-top:1px solid var(--line)}
.wp-line{font-size:14px;margin-bottom:7px}
.wp-bar{height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.12)}
.wp-bar span{display:block;height:100%;transition:width .4s}
.pl-list{padding:4px 12px 12px;display:flex;flex-direction:column;gap:6px;max-height:156px;overflow:auto}
.pl-row{display:grid;grid-template-columns:20px 76px 1fr auto;align-items:center;gap:8px;font-size:13px}
.pl-no{width:19px;height:19px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.pl-velo,.pl-cnt{color:var(--dim);font-variant-numeric:tabular-nums}
.mu-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11.5px;color:var(--dim);margin:10px 0}
.mu-stats>div{background:var(--panel2);border-radius:8px;padding:7px 9px;line-height:1.55;min-width:0}
/* full-screen match pages: 1 lineup & strategy, 2 in-game */
.matchpage{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overflow-x:hidden}
body:has(.matchpage){overflow:hidden}
.mp-wrap{max-width:1120px;margin:0 auto;padding:max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px))}
.mp-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line-strong)}
.mp-bar h2{margin:0;font-size:17px;letter-spacing:-.02em}
.mp-bar small{color:var(--dim);font-size:12px}
.mp-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.mp-foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px;padding:12px 0 calc(12px + env(safe-area-inset-bottom, 0px));background:var(--bg);border-top:1px solid var(--line-strong)}
.live-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px))}
@media(max-width:820px){.mp-cols{grid-template-columns:minmax(0,1fr)}}
@media(min-width:1000px){.live-grid{grid-template-columns:minmax(0,clamp(420px,calc((100vh - 290px)*1.2),600px)) minmax(0,1fr);align-items:start;justify-content:center}.live-side .mu-stats{margin-top:0}}
/* ---- design pass 1: shell, header, nav ---- */
header.top{display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:5px solid var(--team);border-bottom:1px solid var(--line-strong);position:sticky;top:env(safe-area-inset-top, 0px);background:#0d1522;z-index:30;flex-wrap:wrap;margin:0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);background:#0d1522;z-index:31}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:44px;height:44px;flex:none}
.brand small{display:block;color:var(--dim);font-size:11px;letter-spacing:.12em}
.brand b{font-size:17px;letter-spacing:-.03em;white-space:nowrap}
.teaminfo{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.headctrl{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.headctrl .btn{display:inline-flex;align-items:center;gap:6px}
.headctrl .icon{width:18px;height:18px}
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
nav.tabs{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;margin:12px 0 8px;scrollbar-width:none;}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:42px;background:transparent;color:var(--dim);border:0;border-bottom:3px solid transparent;padding:8px 10px;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
nav.tabs .icon{width:18px;height:18px}
nav.tabs button.active{background:var(--panel2);color:var(--txt);border-bottom-color:var(--team-ink);}
nav.tabs button:hover:not(.active){background:var(--panel);color:var(--txt);}
.count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#1a1300;font-size:11px;font-weight:800;line-height:18px;text-align:center}
@media(min-width:1024px){
  .shell{grid-template-columns:168px minmax(0,1fr);gap:28px;align-items:start}
  nav.tabs{flex-direction:column;overflow:visible;position:sticky;top:96px;margin:20px 0}
  nav.tabs button{border-bottom:0;border-left:3px solid transparent;border-radius:6px;justify-content:flex-start;padding:10px 12px;font-size:14px}
  nav.tabs button.active{border-left-color:var(--team-ink)}
  #view{padding-top:20px}
}
@media(max-width:600px){
  .headctrl .lbl{display:none}
  .headctrl .btn{padding:8px 10px}
  .brand svg{width:38px;height:38px}
  .teaminfo{order:3;width:100%;font-size:12px}
  header.top{position:static;gap:10px}
}
/* ---- design pass 1: components ---- */
.icon{width:22px;height:22px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.75}
.btn .icon{width:18px;height:18px;margin-right:2px;vertical-align:-4px}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-quiet{background:transparent}
.eyebrow{margin:0;font-size:11px;font-weight:750;letter-spacing:.14em;color:var(--team-ink);text-transform:uppercase}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--panel2);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:650;white-space:nowrap;color:var(--txt)}
.chip.warn{color:var(--warn)} .chip.good{color:var(--good)} .chip.bad{color:var(--bad)} .chip.team{color:var(--team-ink)}
.panel{background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;padding:20px;min-width:0}
.panel h2,.panel h3{margin:0}
.panel h2{font-size:19px;letter-spacing:-.03em}
.panel h3{font-size:15px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,var(--hero),#0b1420);border:1px solid var(--line-strong);border-top:4px solid var(--team);border-radius:20px;padding:28px 32px}
.hero::before{content:'';position:absolute;width:430px;height:430px;right:-120px;top:30px;border:1px solid #40536a;border-radius:50%;box-shadow:0 0 0 48px #ffffff03,0 0 0 96px #ffffff03;pointer-events:none}
.hero>*{position:relative}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero-title{font-size:clamp(28px,4vw,46px);font-weight:800;line-height:1.16;letter-spacing:-.05em;margin:14px 0 6px;text-wrap:balance}
.hero-sub{color:var(--dim);margin:0;font-size:14px}
.matchup{display:flex;align-items:center;gap:20px;margin:22px 0}
.club-mark{display:flex;align-items:center;gap:12px;min-width:0}
.club-mark strong{font-size:22px;white-space:nowrap}
.club-mark small{display:block;color:var(--dim);font-size:12px;font-weight:500}
.club-mark svg{width:60px;height:60px;flex:none}
.tbd-badge{width:60px;height:60px;border-radius:20px;border:1.5px dashed var(--line-strong);display:grid;place-items:center;color:var(--dim);font-size:22px;font-weight:800;flex:none}
.versus{color:var(--dim);font-weight:700;font-size:14px}
.match-meta{margin-left:auto;text-align:right}
.match-meta span{color:var(--dim);font-size:12px}
.match-meta p{margin:2px 0 0;font-weight:700;white-space:nowrap}
.hero-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-top:18px;border-top:1px solid var(--line-strong);flex-wrap:wrap}
.hero-bottom p{margin:0;font-size:13px;color:var(--dim)}
.hero-bottom strong{display:block;color:var(--txt);margin:4px 0;font-size:16px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hero-cta{min-height:46px;padding:10px 20px;font-size:14px}
.hero-more{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.hero .progress{margin-top:16px;height:4px}
.hero .progress>i{background:var(--team-ink)}
.tasks{margin:20px 0}
.task-list{list-style:none;padding:0;margin:12px 0 0}
.task-list li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.task-list h3{font-size:14.5px;margin:0}
.task-list p{color:var(--dim);font-size:12.5px;margin:3px 0 0;overflow-wrap:anywhere}
.task-list .icon{color:var(--warn)}
.reference{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:16px}
.stat-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
.stat-table caption{text-align:left;color:var(--dim);font-size:11.5px;padding:8px 0 6px}
.stat-table th,.stat-table td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;text-transform:none;letter-spacing:0}
.stat-table th{font-weight:500;color:var(--dim);font-size:11.5px}
.stat-table th:first-child,.stat-table td:first-child{text-align:left}
.stat-table .selected td{background:#ffffff08;color:var(--team-ink)}
.stat-table summary{display:flex;align-items:center;gap:7px;font-weight:700;list-style:none;cursor:pointer;min-height:28px}
.stat-table summary::-webkit-details-marker{display:none}
.stat-table summary::after{content:'+';color:var(--dim);margin-left:4px;font-weight:400}
.stat-table details[open] summary::after{content:'−'}
.stat-table .rk{color:var(--dim);font-weight:500;width:16px;display:inline-block}
.row-detail{font-size:12px;color:var(--dim);font-weight:400;padding:4px 0 2px 23px;margin:0;line-height:1.6}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.metric-grid b{font-size:28px;font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.metric-grid .unit{font-size:14px;font-weight:600;color:var(--dim)}
.metric-grid small{display:block;color:var(--dim);font-size:12px}
.brief-line{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px}
.brief-line .btn{margin-left:auto}
.brief-line .icon{color:var(--dim)}
.feed-item{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.feed-item time{color:var(--dim);font-size:11.5px}
.feed-item p{font-size:13.5px;margin:4px 0 0}
.feed-item:hover p{color:var(--team-ink)}
.game-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;font-size:13px}
@media(max-width:900px){.reference{grid-template-columns:1fr}}
@media(max-width:600px){
  .hero{padding:22px 18px;border-radius:16px}
  .hero-top .eyebrow{font-size:10px;letter-spacing:.08em}
  .matchup{gap:12px}
  .club-mark{flex-direction:column;gap:4px;text-align:center}
  .club-mark strong{font-size:17px}
  .club-mark svg,.tbd-badge{width:48px;height:48px}
  .hero-bottom{flex-direction:column;align-items:stretch;gap:14px}
  .hero-actions .btn{width:100%;justify-content:center}
  .panel{padding:18px 14px}
  .task-list li{grid-template-columns:24px minmax(0,1fr)}
  .task-list .btn{grid-column:2;justify-self:start}
}
.stat-table th,.stat-table td:first-child{white-space:nowrap}
.stars{color:var(--warn);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line-strong)}
.stars .half{display:inline-block;width:.5em;overflow:hidden;vertical-align:bottom}
.stat-table select{background:var(--panel2);color:var(--txt);border:1px solid var(--line-strong);border-radius:6px;padding:4px 6px;font:inherit;font-size:12px}
.stack{display:grid;gap:16px;align-content:start;min-width:0}
</style>

</head>
<body>
<!-- design/icons.svg, inlined once so <use href="#i-…"> works from file:// too -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v8H3z M14 3h7v5h-7z M3 15h7v6H3z M14 12h7v9h-7z"/></symbol>

<script>
"use strict";
const K = window.KBO;
let USER = "KIA"; // the manager's club: chosen on the setup screen, restored from saves
const SEASON_GAMES = 144;

// ---------- helpers ----------
function $(id){return document.getElementById(id);}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function fmtAvg(x){ if(!isFinite(x))x=0; return x.toFixed(3).replace(/^0\./,'.'); }
function fmtEra(er,outs){ if(!outs)return "-"; return (er*9/(outs/3)).toFixed(2); }
function ipStr(outs){ return Math.floor(outs/3)+ (outs%3? " "+(outs%3)+"/3":""); }
function ovrClass(v){ return v>=90?'s90':v>=80?'s80':v>=70?'s70':v>=60?'s60':'s0'; }
function ratColor(v){ return v>=85?'#ffd200':v>=75?'#36c275':v>=65?'#7fd0ff':v>=55?'#9aa7b6':'#6b7785'; }
function bar(v){ return `<span class="bar"><i style="width:${Math.max(4,(v-30)/0.7)}%;background:${ratColor(v)}"></i></span>`; }
function ratNum(v){ return FM.attrNum(v); } // FM 1..20 scale
function pname(team,n){ return `<a href="javascript:void(0)" onclick="App.player('${team}','${n.replace(/'/g,"\\'")}')" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--dim)">${n}</a>`; }
function teamDot(t){ return `<span class="teamdot" style="background:${K.ROSTERS[t].color}"></span>`; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

// ---------- state ----------
let state = null;
let teamGameCount = {};
let currentTab = "dash";

function newBatSeason(){ const s=K.newBatStat(); s.G=0; return s; }
function newPitSeason(){ const s=K.newPitStat(); return s; }

function roundRobin(teams){
  const n=teams.length, arr=teams.slice(), rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++) pairs.push([arr[i],arr[n-1-i]]);
    rounds.push(pairs);
    arr.splice(1,0,arr.pop());
  }
  return rounds;
}
function buildSchedule(){
  const rounds = roundRobin(K.TEAM_IDS); // 9 rounds x 5 pairs
  const sched=[]; let day=0;
  const cycles = SEASON_GAMES / (K.TEAM_IDS.length-1); // 144/9 = 16
  for(let c=0;c<cycles;c++){
    rounds.forEach(pairs=>{
      pairs.forEach(p=>{
        const home = (c%2===0)? p[0]:p[1];
        const away = (c%2===0)? p[1]:p[0];
        sched.push({day:day, home, away, played:false, hr:0, ar:0});
      });
      day++;
    });
  }
  return sched;
}

function initState(){
  // reset rosters to original (in case prior game mutated)
  state = {
    year: 2026,
    cfgs: {},
    season: {},
    schedule: buildSchedule(),
    gameIdx: 0,
    phase: "stove", // stove (스토브리그·전지훈련) | spring (시범경기) | regular | postseason | offseason
    history: [],
    champion: null,
    postseason: null,
    pendingGame: null
  };
  K.TEAM_IDS.forEach(t=>{
    const d = K.defaultLineup(t);
    state.cfgs[t] = {teamId:t, lineup:d.lineup.slice(), positions:d.positions.slice(), rotation:d.rotation.slice(), bullpen:d.bullpen.slice(), closer:d.closer};
    state.season[t] = {W:0,L:0,T:0,RF:0,RA:0,bat:{},pit:{}};
  });
  teamGameCount = {}; K.TEAM_IDS.forEach(t=>teamGameCount[t]=0);
}

// ---------- stat accumulation ----------
function mergeNum(t,s){ for(const k in s){ if(typeof s[k]==='number') t[k]=(t[k]||0)+s[k]; } }
function eBat(team,n){ const b=state.season[team].bat; if(!b[n]) b[n]=newBatSeason(); return b[n]; }
function ePit(team,n){ const p=state.season[team].pit; if(!p[n]) p[n]=newPitSeason(); return p[n]; }

function accumulate(res){
  [res.home,res.away].forEach(team=>{
    const bx=res.box[team];
    for(const n in bx.bat){ const src=bx.bat[n]; const t=eBat(team,n); mergeNum(t,src); if(src.PA>0)t.G++; }
    for(const n in bx.pit){ mergeNum(ePit(team,n), bx.pit[n]); }
  });
  FM.logGame(res);
  const s=state.season;
  s[res.home].RF+=res.homeRuns; s[res.home].RA+=res.awayRuns;
  s[res.away].RF+=res.awayRuns; s[res.away].RA+=res.homeRuns;
  if(res.winner===null){ s[res.home].T++; s[res.away].T++; }
  else { const lo = res.winner===res.home?res.away:res.home; s[res.winner].W++; s[lo].L++; }
  FM.afterGame(res);
}

function buildCfg(team){
  const c=state.cfgs[team];
  const tac = team===USER? (state.matchTac||c.tac) : (c.tac||FM.aiTactics(team));
  return FM.prepareCfg(team, {teamId:team, lineup:c.lineup, positions:c.positions, bullpen:c.bullpen, closer:c.closer, spName:projectedSP(team), tac});
}
function playGame(idx, detail){
  const g=state.schedule[idx];
  if(g.played) return null;
  const hc=buildCfg(g.home), ac=buildCfg(g.away);
  const res=K.simGame(hc,ac,{});
  g.played=true; g.hr=res.homeRuns; g.ar=res.awayRuns;
  accumulate(res);
  if(g.home===USER||g.away===USER) FM.gameReport(res,'regular');
  teamGameCount[g.home]++; teamGameCount[g.away]++;
  return res;
}

// ---------- sim controls ----------
// New flow: auto-sim other teams' games up to our next game, then show PREVIEW (entry submission).
function startNextUserGame(){
  if(state.phase==="spring"){ FM.springPlayNext(); return; }
  if(state.phase!=="regular"){ render(); return; }
  while(state.gameIdx<state.schedule.length){
    const g=state.schedule[state.gameIdx];
    if(g.home===USER||g.away===USER){ state.pendingGame=state.gameIdx; openPreview(); return; }
    playGame(state.gameIdx,false); state.gameIdx++;
  }
  endRegularSeason(); render();
}
function advanceUserGames(n){
  state.pendingGame=null; state.matchTac=null; closeModal();
  for(let i=0;i<n;i++){
    if(state.gameIdx>=state.schedule.length||state.phase!=="regular") break;
    let done=false;
    while(state.gameIdx<state.schedule.length){
      const g=state.schedule[state.gameIdx];
      const isUser=(g.home===USER||g.away===USER);
      playGame(state.gameIdx,false);
      state.gameIdx++;
      if(isUser){done=true;break;}
    }
    if(!done) break;
  }
  if(state.gameIdx>=state.schedule.length) endRegularSeason();
  render();
}
function simRestOfSeason(){
  state.pendingGame=null; closeModal();
  while(state.gameIdx<state.schedule.length){ playGame(state.gameIdx,false); state.gameIdx++; }
  endRegularSeason(); render();
}

// ---------- preview (entry submission) ----------
function recentForm(team){
  const gs=state.schedule.filter(g=>g.played&&(g.home===team||g.away===team)).slice(-5);
  return gs.map(g=>{ const us=g.home===team?g.hr:g.ar, them=g.home===team?g.ar:g.hr;
    return us>them?'<span style="color:var(--good)">승</span>':us<them?'<span style="color:var(--bad)">패</span>':'<span class="muted">무</span>'; }).join(' ')||'<span class="muted">-</span>';
}
function projectedSP(team){
  const c=state.cfgs[team]; const rot=c.rotation.length?c.rotation:[c.bullpen[0]];
  const n = state.phase==='postseason'&&state.postseason&&state.postseason.gc? (state.postseason.gc[team]||0)
    : state.phase==='spring'&&state.spring? (state.spring.gc[team]||0) : teamGameCount[team];
  return rot[n%rot.length];
}
// the user's game waiting for the entry submission: {home, away, ps, label}
function pendingMatch(){
  if(state.pendingGame==='ps'){ const n=psNext(); return n? {home:n.home, away:n.away, ps:true, label:n.label} : null; }
  if(state.pendingGame==='spring'){ const n=FM.springNext(); return n? {home:n.home, away:n.away, spring:true, label:n.label} : null; }
  const g=state.schedule[state.pendingGame]; return g? {home:g.home, away:g.away, ps:false, label:`${state.year} 시즌`} : null;
}
function closePreview(){ const o=$('prematch'); if(o) o.remove(); }
function openPreview(){
  const g=pendingMatch(); if(!g){ closePreview(); return; }
  if(!state.matchTac) state.matchTac=Object.assign({}, K.DEFAULT_TAC, state.cfgs[USER].tac||{});
  const st=standings();
  const rankOf=t=>st.findIndex(x=>x.t===t)+1;
  const ps=state.postseason&&state.postseason.cur;
  const opp = g.home===USER?g.away:g.home;
  const usHome = g.home===USER;
  const spUser=projectedSP(USER), spOpp=projectedSP(opp);
  const su=findPlayer(USER,spUser), so=findPlayer(opp,spOpp);
  const teamCard=(t)=>{ const s=state.season[t]; return `<div style="text-align:center;flex:1">
      ${teamDot(t)} <div style="font-size:16px;font-weight:800;margin:4px 0">${K.ROSTERS[t].name}</div>
      <div class="muted" style="font-size:12px">${g.spring? '시범경기' : g.ps? `정규시즌 ${rankOf(t)}위 · 시리즈 ${t===ps.hi?ps.wHi-(ps.hiStart||0):ps.wLo}승` : (s.W+s.L+s.T? `${rankOf(t)}위 · ${s.W}승 ${s.L}패 ${s.T}무` : '개막전')}</div>
      <div style="font-size:12px;margin-top:4px">최근5: ${recentForm(t)}</div></div>`; };
  const spStat=(t,n)=>{ const s=state.season[t].pit[n]; return s&&s.G>0? `${s.W}승 ${s.L}패 · ERA ${fmtEra(s.ER,s.OUT)}` : '시즌 첫 등판'; };
  const oppLineup=()=>{ const c=state.cfgs[opp]; const pos=c.positions||K.autoPositions(opp,c.lineup); return c.lineup.map((n,i)=>`<div style="display:flex;gap:8px;font-size:12px;padding:2px 0"><span class="muted" style="width:16px">${i+1}</span><span class="pill pos" style="width:30px">${pos[i]||''}</span>${n}</div>`).join(''); };
  const c=state.cfgs[USER], rotIdx=c.rotation.indexOf(spUser);
  const spPick = rotIdx<0? pname(USER,spUser) : `<select aria-label="오늘 선발" onchange="App.setRotation(${rotIdx},this.value)">${K.ROSTERS[USER].pitchers.filter(p=>p.n!==c.closer).map(p=>`<option value="${p.n}" ${p.n===spUser?'selected':''}>${p.n} (${p.role}·${K.ovr(p)})</option>`).join('')}</select>`;
  const html=`<div class="mp-wrap">
    <div class="mp-bar"><div><h2>라인업 · 전략</h2><small>${g.label} · ${usHome?'홈경기 🏠':'원정경기 ✈'}</small></div>
      <button class="btn btn-sm" onclick="App.cancelPreview()">나가기</button></div>
    <div class="row" style="align-items:center;margin:10px 0 4px">
      ${teamCard(g.away)}<div class="big" style="color:var(--dim)">VS</div>${teamCard(g.home)}
    </div>
    <div class="card" style="background:var(--panel2);margin:12px 0">
      <div class="muted" style="text-align:center;font-weight:700;margin-bottom:8px">⚾ 선발 맞대결</div>
      <div class="row" style="justify-content:space-around">
        <div style="text-align:center"><b>${usHome?(opp+' 선발'):'우리 선발'}</b><div style="font-size:15px;margin:2px 0">${usHome? so?so.n:spOpp : spPick}</div><div class="muted" style="font-size:12px">${usHome? spStat(opp,spOpp):spStat(USER,spUser)}</div></div>
        <div class="muted">VS</div>
        <div style="text-align:center"><b>${usHome?'우리 선발':(opp+' 선발')}</b><div style="font-size:15px;margin:2px 0">${usHome? spPick:(so?so.n:spOpp)}</div><div class="muted" style="font-size:12px">${usHome? spStat(USER,spUser):spStat(opp,spOpp)}</div></div>
      </div>
    </div>
    <div class="mp-cols">
      <div class="card"><h3>우리 타순 · 수비 위치 <span class="tag">${USER}</span></h3>${userLineupTable()}</div>
      <div class="card"><h3>상대 예상 타선 <span class="tag">${opp}</span></h3>${oppLineup()}</div>
    </div>
    ${FM.previewNote()}
    ${FM.tacticsCard('match')}
    <div class="mp-foot">
      <button class="btn" onclick="App.cancelPreview();App.tab('lineup')">📋 로테이션·마무리 설정</button>
      <button class="btn primary" onclick="App.startMatch()">✅ 엔트리 제출 & 경기 시작</button>
    </div>
  </div>`;
  let o=$('prematch');
  if(!o){ o=el('<div id="prematch" class="matchpage"></div>'); document.body.appendChild(o); }
  o.innerHTML=html;
}

// ---------- live relay ----------
const Match={ game:null, idx:null, timer:null, speed:1300, paused:true, comm:[], _mult:1, _ended:false, panel:null, ab:null, feed:null,
  start(){
    const g=pendingMatch(); if(!g) return;
    this.idx=state.pendingGame; this.ps=g.ps; this.spring=!!g.spring;
    this.game=new K.InteractiveGame(buildCfg(g.home), buildCfg(g.away), {maxInnings:g.ps?15:g.spring?9:12});
    this._ended=false; this.paused=false; this.panel=null; this.logOpen=window.innerWidth>=1000; this.feed=[]; this.ab=null; this.comm=[{t:'플레이볼!',k:'call'}];
    closeModal(); closePreview();
    let o=document.getElementById('relay'); if(o)o.remove();
    o=el('<div id="relay" class="matchpage"></div>');
    document.body.appendChild(o);

  },
  _tick(){ if(this.paused) return; this._do(); if(!this._ended) this.timer=setTimeout(()=>this._tick(), this.speed*(this._mult||1)); },
  _say(line){ this.comm.unshift(line); this.comm.length=Math.min(this.comm.length,4); this._mult=line.wait||1; },
  // one beat of the broadcast: batter intro → (lead-in line → pitch) × n → [batted-ball suspense] → result
  _do(){
    const g=this.game, ab=this.ab;
    if(g.over && (!ab || ab.committed)){ this.end(); return; }
    if(!ab){ const p=g.prepareAB(); if(!p){ this.end(); return; }
      this.ab={pitches:p.pitches,shown:0,pre:false,susp:false,committed:false,pitName:p.pitName,batName:p.batName,off:p.off,def:p.def,slot:p.slot,oc:p.oc,ev:null,wp0:winProb(g),steal:p.kind==='steal',runner:p.runner,kind:p.kind||'pa'};

    if(ab.shown < ab.pitches.length){
      if(!ab.pre){ ab.pre=true; this._say(Comm.prePitch(g,ab)); this.renderLive(); return; }
      ab.pre=false; ab.shown++; this._say(Comm.pitch(g,ab)); this.renderLive(); return; }
    if(!ab.committed){
      if(ab.pitches[ab.pitches.length-1].res==='IP' && !ab.susp){ ab.susp=true; this._say(Comm.suspense(g,ab)); this.renderLive(); return; }
      const ev=g.commitAB(); ab.committed=true; ab.ev=ev;
      if(ev){ const line=Comm.result(g,ab,ev); ev.call=line.t; this.feed.unshift(ev); this._say(line); }

  },
  play(){ if(this._ended)return; this.paused=false; this.renderLive(); this._tick(); },
  pause(){ this.paused=true; clearTimeout(this.timer); this.renderLive(); },
  stepOne(){ this.paused=true; clearTimeout(this.timer); this._do(); while(!this._ended&&this.ab&&(this.ab.pre||(this.ab.susp&&!this.ab.committed))) this._do(); },
  toEnd(){ this.paused=true; clearTimeout(this.timer);
    if(this.ab && !this.ab.committed){ const ev=this.game.commitAB(); if(ev)this.feed.unshift(ev); }
    this.ab=null; this._flush();
    let n=0; while(!this.game.over && n<3000){ const ev=this.game.step(); if(ev)this.feed.unshift(ev); n++; }
    this.renderLive(); this.end();
  },
  setSpeed(v){ this.speed=parseInt(v,10); },
  togglePanel(p){ this.panel=this.panel===p?null:p; if(!this.paused)this.pause(); else this.renderLive(); },
  // a change asked for mid at-bat: before the first pitch the at-bat restarts with the new man; after it, it waits
  _change(fn, now, later){
    const ab=this.ab;
    if(ab && !ab.committed && ab.shown>0){ this.queued=(this.queued||[]).concat([fn]); this.feed.unshift({sysmsg:later}); this.panel=null; this.renderLive(); return; }
    if(!fn()) return;
    if(ab && !ab.committed) this.ab=null; // the prepared at-bat was dropped by the engine

  },
  _flush(){ const q=this.queued||[]; this.queued=[]; q.forEach(fn=>fn()); },
  doSub(name){ this._change(()=>this.game.subPitcher(USER,name), `투수 교체 → ${name}`, `투수 교체 예고 → ${name} (이 타석이 끝나면)`); },
  doPinch(name){ this._change(()=>{ if(this.game.pinchHit(USER,name)) return true; FM.notify('이미 교체되어 나간 선수는 다시 출전할 수 없습니다.'); return false; },
    `대타 → ${name}`, `대타 예고 → ${name} (다음 타석)`); },
  end(){ if(this._ended)return; this._ended=true; this.paused=true; clearTimeout(this.timer); this.renderLive(); },

    const res=this.game.result();

    if(this.ps){ psRecord(res); render(); return; }

    state.gameIdx=this.idx+1;
    FM.gameReport(res,'regular');

    render();
  },
  order(c){ this.game.orderCmd(USER,c); this.panel=null; this.feed.unshift({sysmsg:{bunt:'희생번트 사인',steal:'도루 사인',ibb:'고의4구 지시'}[c]+' (다음 타석)'}); this.renderLive(); },
  setTac(k,v){ if(v==='true')v=true; if(v==='false')v=false; this.game.setTac(USER,k,v); this.feed.unshift({sysmsg:`작전 변경: ${FM.tacLabel(k,v)}`}); this.renderLive(); },
  renderLive(){ const o=document.getElementById('relay'); if(o) o.innerHTML=`<div class="mp-wrap">${relayHTML(this.game,this.feed,this)}</div>`; }
};

// standard normal CDF (Zelen & Severo)
function ncdf(z){ const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2); const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }
// expected runs for the rest of a half-inning by runners (1B=1,2B=2,3B=4) and outs
const RE24=[[0.50,0.27,0.11],[0.88,0.53,0.23],[1.11,0.68,0.33],[1.47,0.92,0.43],[1.30,0.93,0.39],[1.67,1.13,0.49],[1.92,1.36,0.59],[2.36,1.58,0.77]];
// home team's chance to win from score, inning, outs and runners: the runs still to come are treated as normal
function winProb(g){
  const h=g.h,a=g.a;
  if(g.over) return g.winner===h?1:(g.winner===a?0:0.5);
  const top=g.half==='top', last=Math.max(9,g.inning);
  const re=RE24[(g.bases[0]?1:0)+(g.bases[1]?2:0)+(g.bases[2]?4:0)][Math.min(2,g.outs)];
  const per=0.52, v=1.1; // runs per half-inning: mean, variance
  const awayLeft=last-g.inning, homeLeft=last-g.inning+(top?1:0);
  const mu=g.score[h]-g.score[a]+(homeLeft-awayLeft)*per+(top?-re:re);
  const sd=Math.sqrt((homeLeft+awayLeft)*v+0.9*re+0.25);
  const pWin=1-ncdf((0.5-mu)/sd), pTie=ncdf((0.5-mu)/sd)-ncdf((-0.5-mu)/sd);
  return Math.min(0.99,Math.max(0.01,pWin+pTie*0.52)); // a tie goes to extras, a near coin flip
}
// pitch-by-pitch list, newest first, with the count after each pitch
function pitchList(pitches){
  if(!pitches.length) return '';
  let b=0,st=0;
  const rows=pitches.map((p,i)=>{
    if(p.res==='B')b++; else if(p.res==='F'){ if(st<2)st++; } else if(p.res==='S'||p.res==='SW')st++;
    const end=p.res==='IP'||p.res==='HBP'||b>=4||st>=3;
    return `<div class="pl-row"><span class="pl-no" style="background:${PITCHCOLOR[p.res]||'#888'}">${i+1}</span><b>${PITCHLABEL[p.res]||''}</b><span class="pl-velo">${p.velo?p.velo+'km/h ':''}${p.type}</span><span class="pl-cnt">${end?'':b+' - '+st}</span></div>`;
  });
  return `<div class="pl-list">${rows.reverse().join('')}</div>`;
}

// ----- play-by-play commentary (FM-style text lines) -----
// each line: {t:text, k:'quiet'|'call'|'tense'|'big', wait: how long the next beat waits, as a multiple of the speed}
const Comm={
  pick(a){ return a[Math.floor(Math.random()*a.length)]; },
  outsTxt(n){ return n===0?'무사':n+'사'; },
  basesTxt(b){ const on=[b[0]?1:0,b[1]?2:0,b[2]?3:0].filter(Boolean); return !on.length?'주자 없음':on.length===3?'만루':on.join(',')+'루'; },
  // what rides on this plate appearance, from the batting side's view
  stakes(g,off){
    const def=off===g.h?g.a:g.h, diff=g.score[off]-g.score[def], onBase=g.bases.filter(Boolean).length, late=g.inning>=7;
    if(g.half==='bottom'&&g.inning>=9&&off===g.h&&diff<=0&&onBase+1>-diff) return {t:diff===0?'끝내기 찬스!':'한 방이면 끝내기 역전!',hot:true};
    if(diff<0&&onBase+1>-diff) return {t:'한 방이면 역전!',hot:late||onBase>=2};
    if(diff<0&&onBase+1===-diff) return {t:'동점 주자가 타석에 있습니다.',hot:late};
    if(diff===0&&onBase&&late) return {t:'균형을 깰 기회!',hot:true};
    if(onBase===3) return {t:'만루 찬스!',hot:true};
    if((g.bases[1]||g.bases[2])&&late&&Math.abs(diff)<=2) return {t:'득점권 찬스.',hot:true};
    return null;
  },
  intro(g,ab){
    if(ab.steal) return {t:`1루 주자 ${ab.runner}, 리드 폭을 크게 가져갑니다… 타석에는 ${ab.batName}.`, k:'tense', wait:1.1};
    if(ab.kind==='ibb') return {t:`벤치에서 사인이 나옵니다… ${ab.batName}을(를) 거릅니다. 고의4구!`, k:'call', wait:1.2};
    if(ab.kind==='bunt') return {t:`${ab.slot}번 ${ab.batName}, 타석에서 번트 자세를 잡습니다. ${this.outsTxt(g.outs)} ${this.basesTxt(g.bases)}.`, k:'tense', wait:1.2};
    const x=g.box[ab.off].bat[ab.batName], today=x&&x.PA?`오늘 ${x.AB}타수 ${x.H}안타`:'오늘 첫 타석';
    const st=this.stakes(g,ab.off);
    return {t:`${ab.slot}번 타자 ${ab.batName}, 타석에 들어섭니다. ${today}. ${this.outsTxt(g.outs)} ${this.basesTxt(g.bases)}${st?' — '+st.t:''}`, k:st&&st.hot?'tense':'quiet', wait:1.2};
  },
  prePitch(g,ab){
    if(ab.steal) return {t:`${ab.pitName}, 세트포지션에서… 주자 스타트!`, k:'tense', wait:0.9};
    if(ab.kind==='ibb') return {t:'포수가 일어서서 옆으로 빠져 앉습니다…', k:'quiet', wait:0.8};
    if(ab.kind==='bunt') return {t:'1·3루수 전진! 투수 투구…', k:'tense', wait:0.9};
    const c=countOf(ab.pitches.slice(0,ab.shown)), n=ab.shown+1, P=ab.pitName, B=ab.batName;
    const st=this.stakes(g,ab.off), hot=!!(st&&st.hot);
    if(c.b===3&&c.s===2) return {t:`풀카운트… ${P}, 운명의 ${n}구!`,k:'tense',wait:1.1};
    if(c.s===2) return {t:this.pick([`투 스트라이크. ${P}, 결정구를 고릅니다…`,`${B}, 몰렸습니다. ${n}구째…`,`승부구가 들어갑니다…`]),k:hot?'tense':'call',wait:0.9};
    if(c.b===3) return {t:this.pick([`쓰리 볼. 스트라이크가 필요한 ${P}…`,`볼넷 위기, ${P}의 ${n}구…`]),k:'call',wait:0.9};
    if(g.bases.some(Boolean)&&Math.random()<0.4) return {t:this.pick(['세트포지션… 주자를 한번 쳐다봅니다.','짧은 세트포지션에서…']),k:hot?'tense':'quiet',wait:0.8};
    return {t:this.pick([`${P}, 사인을 교환합니다…`,`${P}, 와인드업…`,`${P}, ${n}구째…`,`${B}, 배트를 고쳐 쥡니다…`,'포수가 미트를 내밀고…']),k:hot?'tense':'quiet',wait:0.75};
  },
  // location in the batter's terms (inside/outside depends on which box he stands in)
  where(p,ab){
    const rh=batSide(ab.batName,ab.pitName)!=='좌', inX=rh?p.x<0.42:p.x>0.58, outX=rh?p.x>0.58:p.x<0.42;
    const v=p.y<0.36?'높은 ':p.y>0.64?'낮은 ':'';
    return (inX?'몸쪽 ':outX?'바깥쪽 ':(v?'':'한가운데 '))+v;
  },
  pitch(g,ab){
    const p=ab.pitches[ab.shown-1], c=countOf(ab.pitches.slice(0,ab.shown)), loc=this.where(p,ab);
    const sp=p.type==='직구'&&p.velo>=150?`${p.velo}km 강속구`:`${p.velo}km ${p.type}`, cnt=` (${c.b}-${Math.min(c.s,2)})`;
    // strikeouts get the big treatment only when something rides on them
    if(ab.steal) return {t:`${sp}… 포수, 2루로 송구!`,k:'tense',wait:1.3};
    if(p.res==='IBB') return {t:`${ab.batName}, 1루로 걸어 나갑니다.`,k:'quiet'};
    if(ab.kind==='bunt'&&p.res==='IP') return {t:'번트! 공을 굴립니다…',k:'tense',wait:0.8};
    const st=this.stakes(g,ab.off), kk=st&&st.hot?'big':'tense';
    const inZone=p.x>=0.33&&p.x<=0.67&&p.y>=0.3&&p.y<=0.7, near=!inZone&&p.x>0.27&&p.x<0.73&&p.y>0.24&&p.y<0.76;
    switch(p.res){
      case 'B': if(c.b>=4) return {t:`${loc}${sp}… 볼! 볼넷입니다.`,k:'call'};
        return near?{t:`${loc}${sp}… 아슬아슬하게 빠집니다. 볼!${cnt}`,k:'call'}:{t:`${loc}${sp}, 빠집니다. 볼.${cnt}`,k:'quiet'};
      case 'S': return c.s>=3?{t:`${loc}${sp}! 루킹 삼진!! 방망이가 나오지 않습니다.`,k:kk,wait:1.3}:{t:`${loc}${sp}, 그대로 꽂힙니다. 스트라이크!${cnt}`,k:'call'};
      case 'SW': return c.s>=3?{t:`${sp}에 헛스윙! 삼진!!`,k:kk,wait:1.3}:{t:`${loc}${sp}에 헛스윙!${cnt}`,k:'call'};
      case 'F': return {t:this.pick(['뒤로 넘어가는 파울.','3루 쪽 관중석으로 파울.','1루 쪽 파울.','걷어냅니다, 파울.'])+cnt,k:'quiet'};
      case 'IP': return {t:`${loc}${sp}… 쳤습니다!`,k:'tense',wait:0.7};
      case 'HBP': return {t:`아! ${sp}가 몸에 맞습니다!`,k:'call'};
    }
    return {t:sp,k:'quiet'};
  },
  // beat between contact and the result; the wording sets how the play can end (a "deep" ball can't become a double play)
  suspense(g,ab){
    if(ab.kind==='bunt'){ ab.flavor='bunt'; return {t:this.pick(['3루 쪽으로 구르는 타구, 투수 달려 나옵니다…','1루 쪽 번트, 1루수 대시!']),k:'tense',wait:1.0}; }
    const oc=ab.oc, dpPossible=g.bases[0]&&g.outs<2;
    let opts;
    // "deep" (warning-track) build-ups stay rare on outs so they keep their bite; homers sometimes start as an ordinary fly
    if(oc==='HR') opts=[['높이 떴습니다! 멀리, 멀리…','deep'],['잘 맞았습니다! 외야로 쭉 뻗어갑니다…','deep'],['외야로 뜬 타구…','fly']];
    else if(oc==='2B'||oc==='3B') opts=[['날카로운 타구! 외야로…','sharp'],['잘 맞았습니다! 외야로 쭉 뻗어갑니다…','deep'],['외야로 뜬 타구…','fly']];
    else if(oc==='1B') opts=[['날카로운 타구!','sharp'],['빗맞은 타구…','weak'],['맞았습니다! 타구는…','any']];
    else if(!dpPossible&&Math.random()<0.08) opts=[['높이 떴습니다! 멀리, 멀리…','deep']];
    else opts=[['맞았습니다! 타구는…','any'],['빗맞은 타구…','weak'],['날카로운 타구!','sharp']].concat(dpPossible?[]:[['외야로 뜬 타구…','fly']]);
    const o=this.pick(opts); ab.flavor=o[1];
    return {t:o[0],k:'tense',wait:o[1]==='deep'?1.5:1.1};
  },
  result(g,ab,ev){
    const P=a=>this.pick(a), off=ev.off, def=ev.def, before=ev.score[off]-ev.runs, other=ev.score[def], fl=ab.flavor;
    let t='', k='call', wait=1.5;
    switch(ev.oc){
      case 'K': t='삼진 아웃.'; wait=1.1; break;
      case 'BB': t=ev.runs?'밀어내기 볼넷! 한 점이 들어옵니다.':'볼넷으로 걸어 나갑니다.'; break;
      case 'HBP': t=ev.runs?'밀어내기 사구! 한 점이 들어옵니다.':'몸에 맞는 공으로 1루에 나갑니다.'; break;
      case 'GIDP': { const d=P([['유격수','6-4-3'],['2루수','4-6-3'],['3루수','5-4-3']]); t=`${d[0]} 땅볼… ${d[1]} 병살타! 두 개를 잡아냅니다.`; k='big'; break; }
      case 'SF': t=`${P(['좌익수','중견수','우익수'])} 희생플라이! 3루 주자 홈인.`; break;
      case 'IBB': t=`고의4구. ${ev.runs?'밀어내기로 한 점이 들어옵니다.':'주자가 하나 늘어납니다.'}`; break;
      case 'SAC': t=P(['1루에서 타자 아웃, 주자는 한 베이스씩 진루. 희생번트 성공!','침착하게 1루 송구, 아웃. 희생번트 성공입니다.']); break;
      case 'FC': t=P(['선행 주자를 잡아냅니다! 번트 실패.','빠른 송구, 선행 주자 포스 아웃! 번트 작전 실패.']); k='tense'; break;
      case 'BUNT1B': t=P(['기습 번트 안타! 1루에서 살았습니다!','번트가 절묘합니다! 내야 안타!']); k='tense'; break;
      case 'SB': t=P([`세이프! ${ev.runner}, 2루 도루 성공!`,`여유 있게 세이프! ${ev.runner}의 도루!`]); k='tense'; break;
      case 'CS': t=P([`아웃! 포수의 정확한 송구, ${ev.runner} 도루 실패!`,`태그 아웃! ${ev.runner}, 2루에서 잡힙니다.`]); k='big'; break;
      case 'E': t=`${P(['유격수','2루수','3루수','1루수'])} 실책! 공을 놓칩니다, 타자 주자 살아 나갑니다.`; k='tense'; break;
      case 'OUT': {
        const of=P(['좌익수','중견수','우익수']), inf=P(['유격수','2루수','3루수','1루수','투수']);
        if(fl==='deep'){ t=`${of}, 뒤로… 뒤로… 담장 앞에서 잡아냅니다! 아웃.`; k='tense'; }
        else if(fl==='fly') t=P([`${of} 플라이 아웃.`,`${of}, 앞으로 달려 나와 잡습니다. 아웃.`,`${of}가 자리를 잡고… 잡았습니다. 아웃.`]);
        else if(fl==='weak') t=P([`${inf} 앞 땅볼, 1루에서 아웃.`,`내야 플라이, ${inf}가 잡습니다.`]);
        else if(fl==='sharp') t=P([`${inf} 정면 직선타! 아웃.`,`${of} 정면으로 가는 타구, 잡혔습니다.`,`${inf}, 몸을 날려 잡아냅니다! 아웃!`]);
        else t=P([`${inf} 땅볼, 1루에서 아웃.`,`${of} 플라이 아웃.`,`${inf} 땅볼, 깔끔하게 처리합니다.`]);
        if(ev.adv) t+=' 그 사이 2루 주자는 3루까지.';
        break; }
      case '1B': t=fl==='weak'?P(['빗맞았지만 코스가 좋습니다! 안타!','내야 안타! 1루에서 살았습니다!']):P(['중전 안타!','3유간을 빠지는 좌전 안타!','1-2루간을 꿰뚫는 우전 안타!','투수 옆을 스치는 중전 안타!']); break;
      case '2B': t=P(['좌중간을 가르는 2루타!','우익선상 2루타!','좌익선상을 타고 흐르는 2루타!','우중간 펜스까지 굴러가는 2루타!']); k='tense'; break;
      case '3B': t=P(['우중간 깊숙한 3루타!','펜스 맞고 튀는 사이 3루까지! 3루타!']); k='tense'; break;
      case 'HR': t=`넘어갔습니다!!! ${P(['좌측','가운데','우측'])} 담장을 넘기는 ${ev.batter}의 ${['','솔로 홈런','투런 홈런','쓰리런 홈런','만루 홈런'][ev.runs]||'홈런'}!`; k='big'; wait=2.4; break;
    }
    if(ev.runs&&ev.oc!=='HR'){ t+=` ${ev.runs}점 득점!`; wait=Math.max(wait,1.9); if(k==='call')k='tense'; }
    if(ev.runs){
      if(before<other&&ev.score[off]>other){ t+=' 역전!!'; k='big'; wait=2.4; }
      else if(before<other&&ev.score[off]===other){ t+=' 동점!'; k='big'; wait=2.2; }
      t+=` (${g.a} ${ev.score[g.a]} : ${ev.score[g.h]} ${g.h})`;
    }
    if(ev.walkoff){ t+=' 끝내기!!! 경기 끝!'; k='big'; wait=2.6; }
    else if(g.over) t+=' 경기 종료!';
    else if(ev.half!==g.half||ev.inning!==g.inning) t+=' 공수 교대.';
    else if(['K','OUT','GIDP','SF','CS','SAC','FC'].includes(ev.oc)) t+=` ${g.outs}아웃.`;
    return {t,k,wait};
  }
};

function relayHTML(game,feed,M){
  if(!game) return '';
  const h=game.h, a=game.a, ab=M.ab;
  const offId = ab? ab.off : game.offId();
  const defId = ab? ab.def : game.defId();
  const pitName = ab? ab.pitName : game.pitcher[defId];
  const batName = ab? ab.batName : game.dueBatterName();
  const slot = ab? ab.slot : (game.order[offId]%game.lineup[offId].length+1);
  const pit = K.getP(defId,pitName), bat = K.getB(offId,batName);
  const shown = ab? ab.pitches.slice(0,ab.shown) : [];
  const committed = ab? ab.committed : true;
  const cnt = countOf(shown);
  const userBatting = offId===USER, userPitching = defId===USER;

  let ptot=game.ptot[defId], pstr=game.pstr[defId], pball=game.pball[defId];
  if(ab && !committed){ shown.forEach(p=>{ ptot++; if(p.res==='B'||p.res==='HBP')pball++; else pstr++; }); }

  const inningTxt = `${game.inning}회${game.half==='top'?'초':'말'}`;
  const outDots = `<span style="color:#e0556a">${'●'.repeat(game.outs)}</span><span style="color:var(--dim)">${'○'.repeat(Math.max(0,2-game.outs))}</span>`;

  const sb = `<div style="display:flex;align-items:center;gap:7px;background:linear-gradient(90deg,${K.ROSTERS[a].color},${K.ROSTERS[h].color});border-radius:10px;padding:7px 10px;color:#fff;font-size:13px;flex-wrap:wrap;text-shadow:0 1px 2px rgba(0,0,0,.4)">
    <b>${a} ${game.score[a]}</b><span style="opacity:.6">:</span><b>${game.score[h]} ${h}</b>
    <span style="margin-left:4px">${inningTxt}</span>${baseMini(game.bases)}
    <span><b>${cnt.b}</b>B <b>${cnt.s}</b>S</span><span>${outDots}</span>
    <span style="margin-left:auto;opacity:.95;font-size:12px">${pitName} ${ptot}구</span>
  </div>`;

  const bSeason = state.season[offId].bat[batName];
  const matchAvg = (bSeason&&bSeason.AB>0)? fmtAvg(bSeason.H/bSeason.AB) : '.---';
  const psl = game.box[defId].pit[pitName];
  const pSeason = state.season[defId].pit[pitName];
  const pOvr=K.ovr(pit), bOvr=K.ovr(bat);
  const matchup = `<div class="mu">
    <div class="mu-side mu-p"><div class="mu-txt"><div class="mu-name"><span class="mu-tag" style="background:#2f6fd6">투</span><b>${pname(defId,pitName)}</b></div>
      <div class="mu-sub">${handP(pitName)}투 | No.${jno(pitName)} | <span class="ovr ${ovrClass(pOvr)}">${pOvr}</span></div></div>${avatar(K.ROSTERS[defId].color,jno(pitName))}</div>
    <span class="mu-vs">VS</span>
    <div class="mu-side">${avatar(K.ROSTERS[offId].color,jno(batName))}<div class="mu-txt"><div class="mu-name"><span class="mu-tag" style="background:#d6453d">타</span><b>${pname(offId,batName)}</b></div>
      <div class="mu-sub">${slot}번 ${game.pos[offId][slot-1]||bat.pos} | ${handB(batName)}타 | <span class="ovr ${ovrClass(bOvr)}">${bOvr}</span></div></div></div>
  </div>`;
  const bToday = game.box[offId].bat[batName];
  const stats = `<div class="mu-stats">
    <div style="${userPitching?'box-shadow:inset 0 0 0 1px var(--accent)':''}">${pSeason&&pSeason.G?`${pSeason.W}승 ${pSeason.L}패 · 평균자책 ${fmtEra(pSeason.ER,pSeason.OUT)}`:'시즌 첫 등판'}<br>오늘 ${psl?`${ipStr(psl.OUT)}이닝 · ${psl.SO}K · ${psl.ER}실점`:'0이닝'} · ${ptot}구 <span style="opacity:.7">(S${pstr} B${pball})</span></div>
    <div style="${userBatting?'box-shadow:inset 0 0 0 1px var(--accent)':''}">시즌 타율 ${matchAvg}${bSeason&&bSeason.AB>0?` · ${bSeason.HR}홈런 ${bSeason.RBI}타점`:''}<br>오늘 ${bToday&&bToday.PA?`${bToday.AB}타수 ${bToday.H}안타${bToday.HR?' '+bToday.HR+'홈런':''}${bToday.RBI?' '+bToday.RBI+'타점':''}`:'첫 타석'}</div>
  </div>`;
  const cm=M.comm||[], cur=cm[0];
  const caption = cur ? `<div class="cm-now cm-${cur.k||'call'}">${cur.t}</div>${cm.slice(1,3).map(l=>`<div class="cm-prev">${l.t}</div>`).join('')}` : (game.over?'경기 종료':'플레이볼!');
  // win probability for the user's club, and how much the last play moved it
  const wpH=winProb(game), wpU=USER===h?wpH:1-wpH;
  let wpDelta='';
  if(ab&&committed&&ab.wp0!=null){ const d=(wpU-(USER===h?ab.wp0:1-ab.wp0))*100; if(Math.abs(d)>=0.05) wpDelta=`<span style="color:${d>0?'#4cc38a':'#6aa7ff'}">(${d>0?'+':''}${d.toFixed(1)}%)</span>`; }
  const wpBox = `<div class="wp"><div class="wp-line"><b style="color:var(--accent)">${USER}</b> 승리 확률 <b>${(wpU*100).toFixed(1)}%</b> ${wpDelta}</div>
    <div class="wp-bar"><span style="width:${(wpU*100).toFixed(1)}%;background:var(--accent)"></span></div></div>`;

  const ctrl = game.over ? `<button class="btn primary" onclick="Match.finalize()">✅ 경기 종료 & 결과 반영</button>`
    : `<div class="row" style="gap:6px;flex-wrap:wrap">
        ${M.paused?`<button class="btn primary" onclick="Match.play()">▶ 재생</button>`:`<button class="btn" onclick="Match.pause()">⏸ 일시정지</button>`}
        <button class="btn" onclick="Match.stepOne()">⏭ 한 구</button>
        <button class="btn" onclick="Match.toEnd()">⏩ 끝까지</button>
        <select onchange="Match.setSpeed(this.value)">
          <option value="1900" ${M.speed==1900?'selected':''}>느리게</option>
          <option value="1300" ${M.speed==1300?'selected':''}>보통</option>
          <option value="700" ${M.speed==700?'selected':''}>빠르게</option>
          <option value="250" ${M.speed==250?'selected':''}>매우 빠르게</option>
        </select>
      </div>`;

  let interv='';
  if(!game.over){
    const btns=[];
    if(userPitching) btns.push(`<button class="btn" onclick="Match.togglePanel('sub')">🔄 투수 교체</button>`);
    if(userBatting) btns.push(`<button class="btn" onclick="Match.togglePanel('pinch')">🏏 대타</button>`);
    btns.push(`<button class="btn" onclick="Match.togglePanel('tac')">🎯 작전</button>`);
    interv = btns.length? `<div class="row" style="margin-top:8px;gap:6px">${btns.join('')}</div>`:'';
    if(M.panel==='sub'&&userPitching){
      const avail=game.availPitchers(USER).sort((x,y)=>K.ovr(y)-K.ovr(x));
      interv += `<div class="card" style="margin-top:8px;background:var(--panel2)"><div class="muted" style="margin-bottom:6px">교체할 투수 (현재: ${pitName})</div>
        <div class="row" style="gap:6px;flex-wrap:wrap">${avail.slice(0,12).map(p=>`<button class="btn" onclick="Match.doSub('${p.n}')">${p.n} <span class="muted">${p.role}·${K.ovr(p)}</span></button>`).join('')||'<span class="muted">없음</span>'}</div></div>`;

// ---------- standings ----------
function standings(){
  return K.TEAM_IDS.map(t=>{
    const s=state.season[t];
    const gp=s.W+s.L+s.T;
    const pct = (s.W+s.L)? s.W/(s.W+s.L):0;
    return {t, W:s.W, L:s.L, T:s.T, gp, pct, RF:s.RF, RA:s.RA, diff:s.RF-s.RA};
  }).sort((a,b)=> b.pct-a.pct || b.diff-a.diff);
}

// ---------- postseason ----------
// KBO postseason: games go to 15 innings; a tie still counts as a game played but gives no win.
// Wild card: 4 vs 5 at seed 4's park, at most 2 games, seed 4 starts with a 1-win edge.
const PS_ROUNDS=[
  {name:"와일드카드", bestOf:3, hiStart:1, maxGames:2, hiHomeAll:true},
  {name:"준플레이오프", bestOf:5},
  {name:"플레이오프", bestOf:5},
  {name:"한국시리즈", bestOf:7}
];
function startPostseason(){
  const seed=standings().slice(0,5).map(x=>x.t);
  const gc={}; K.TEAM_IDS.forEach(t=>gc[t]=0);
  state.postseason={seeds:seed, rounds:[], stage:0, gc, cur:null, champion:null};
  psOpenSeries(seed[3], seed[4]);
}
function psOpenSeries(hi, lo){
  const ps=state.postseason, rd=PS_ROUNDS[ps.stage];
  ps.cur={name:rd.name, hi, lo, bestOf:rd.bestOf, need:Math.ceil(rd.bestOf/2), hiStart:rd.hiStart||0, maxGames:rd.maxGames||0,
    hiHomeAll:!!rd.hiHomeAll, wHi:rd.hiStart||0, wLo:0, games:[]};
  if(hi===USER||lo===USER) FM.psSeriesMessage(ps.cur);
}
function psSeriesOver(c){ return c.wHi>=c.need || c.wLo>=c.need || (c.maxGames>0 && c.need-c.wLo>c.maxGames-c.games.length); }
// next game of the current series: {home, away, label}
function psNext(){
  const ps=state.postseason; if(!ps||!ps.cur) return null;
  const c=ps.cur, n=c.games.length;
  const hiHome = c.hiHomeAll || n<2 || n>=4;
  return {home:hiHome?c.hi:c.lo, away:hiHome?c.lo:c.hi, label:`${c.name} ${n+1}차전`};
}
function psCfg(team){ return buildCfg(team); }
function psRecord(res){
  const ps=state.postseason, c=ps.cur;
  if(res.winner===c.hi) c.wHi++; else if(res.winner===c.lo) c.wLo++;
  c.games.push({home:res.home, away:res.away, hr:res.homeRuns, ar:res.awayRuns, winner:res.winner});
  ps.gc[res.home]++; ps.gc[res.away]++;
  FM.afterPsGame(res);
  if(res.home===USER||res.away===USER) FM.gameReport(res,'ps');
  if(!psSeriesOver(c)) return;
  const hiWon = c.wLo<c.need;
  const r={winner:hiWon?c.hi:c.lo, loser:hiWon?c.lo:c.hi, wHi:c.wHi, wLo:c.wLo, games:c.games, bestOf:c.bestOf, hiStart:c.hiStart};
  ps.rounds.push({name:c.name, hi:c.hi, lo:c.lo, r});
  if(c.hi===USER||c.lo===USER) FM.psSeriesResult(c.name, r);
  ps.stage++;
  if(ps.stage>=PS_ROUNDS.length){ ps.cur=null; finishPostseason(r.winner); return; }
  psOpenSeries(ps.seeds[3-ps.stage], r.winner);
}
// play the next postseason game: the user's games go through the preview and live relay
function psPlayNext(){
  if(state.phase!=="postseason"||!state.postseason.cur) return;
  const n=psNext();
  if(n.home===USER||n.away===USER){ state.pendingGame='ps'; openPreview(); return; }
  psRecord(K.simGame(psCfg(n.home), psCfg(n.away), {maxInnings:15}));
  render();
}
// simulate games until the user's next one (or to the end when the user is out)
function psAuto(toEnd){
  let guard=0;
  while(state.phase==="postseason" && state.postseason.cur && guard++<40){
    const n=psNext();
    if(!toEnd && (n.home===USER||n.away===USER)) break;
    psRecord(K.simGame(psCfg(n.home), psCfg(n.away), {maxInnings:15}));
  }
  closeModal(); render();
}
function finishPostseason(champ){
  state.postseason.champion=champ;
  state.champion=champ;
  state.phase="offseason";
  const st=standings();
  state.history.push({year:state.year, champion:state.champion, standings:st.map(x=>({t:x.t,W:x.W,L:x.L,pct:x.pct})), userRank: st.findIndex(x=>x.t===USER)+1});
  FM.onSeasonEnd();
  showSeasonEndModal();
  FM.maybeShowFired();
}
function endRegularSeason(){
  if(state.phase!=="regular") return;
  state.phase="postseason";
  startPostseason();
  FM.onRegularSeasonEnd();
}

// ---------- next season (aging) ----------
function ageRosters(){
  const room=(p,d)=> d>0 && p.pot && K.ovr(p)>=p.pot ? 0 : d;
  for(const t in K.ROSTERS){
    const farm=K.ROSTERS[t].farm||[];
    K.ROSTERS[t].batters.concat(farm.filter(p=>p.type==='B')).forEach(p=>{
      p.age++;
      const d = room(p,ageDelta(p.age)), was=FM.snap(p);
      ['con','pow','eye'].forEach(k=> p[k]=clamp(p[k]+d+rint(-1,1),40,99));
      ['spd','fld','arm'].forEach(k=> p[k]=clamp(p[k]+ (p.age>=31? d-1 : d) + rint(-1,1),40,99));
      FM.capPot(p,was);
    });
    K.ROSTERS[t].pitchers.concat(farm.filter(p=>p.type==='P')).forEach(p=>{
      p.age++;
      const d=room(p,ageDelta(p.age)), was=FM.snap(p);
      ['stu','ctl','mov'].forEach(k=> p[k]=clamp(p[k]+d+rint(-1,1),40,99));
      p.sta=clamp(p.sta + (p.age>=32? d-1:d) + rint(-1,1),35,99);
      FM.capPot(p,was);
    });
  }
}
function ageDelta(age){ if(age<=23)return 2; if(age<=26)return 1; if(age<=29)return 0; if(age<=32)return -1; if(age<=36)return -2; return -3; }
function clamp(x,a,b){return x<a?a:(x>b?b:x);}
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1));}

function nextSeason(){
  ageRosters();
  FM.offseasonMoves(); // departures, retirements, rookies before lineups are rebuilt
  state.year++;
  state.schedule=buildSchedule();
  state.gameIdx=0;
  state.phase="stove";
  state.spring=null;
  state.postseason=null;
  state.champion=null;
  state.pendingGame=null;
  K.TEAM_IDS.forEach(t=>{ state.season[t]={W:0,L:0,T:0,RF:0,RA:0,bat:{},pit:{}}; });
  // re-validate cfgs (players persist; ratings changed). Keep user's lineup if all exist.
  K.TEAM_IDS.forEach(t=>{
    const d=K.defaultLineup(t);
    const c=state.cfgs[t];
    const validB = K.ROSTERS[t].batters.map(b=>b.n);
    const validP = K.ROSTERS[t].pitchers.map(p=>p.n);
    if(t!==USER){ state.cfgs[t]={teamId:t,lineup:d.lineup.slice(),positions:d.positions.slice(),rotation:d.rotation.slice(),bullpen:d.bullpen.slice(),closer:d.closer}; }
    else {
      c.lineup=c.lineup.filter(n=>validB.includes(n)); while(c.lineup.length<9){ const add=d.lineup.find(n=>!c.lineup.includes(n)); if(!add)break; c.lineup.push(add);} c.lineup=c.lineup.slice(0,9);
      c.positions=K.autoPositions(t,c.lineup);
      c.rotation=c.rotation.filter(n=>validP.includes(n)); if(c.rotation.length<5){ d.rotation.forEach(n=>{if(!c.rotation.includes(n)&&c.rotation.length<5)c.rotation.push(n);}); }
      c.bullpen=c.bullpen.filter(n=>validP.includes(n)); if(!validP.includes(c.closer))c.closer=d.closer;
    }
  });
  teamGameCount={}; K.TEAM_IDS.forEach(t=>teamGameCount[t]=0);
  FM.onNewSeason();
  closeModal(); currentTab="dash"; render();
}

    const mine=c.hi===USER||c.lo===USER;
    const inPS=state.postseason.seeds.includes(USER) && !state.postseason.rounds.some(r=>r.r.loser===USER);
    return {eyebrow:`POSTSEASON / ${c.name}`, title:mine?`${c.name}, 우리의 가을.`:c.name,
      sub:`${c.hi} ${c.wHi-c.hiStart}승${c.hiStart?' (+1승 어드밴티지)':''} vs ${c.lo} ${c.wLo}승 · ${c.bestOf===3?'2선승':c.need+'선승'}`,

  }
  return {eyebrow:`${state.year} SEASON / FINAL`, title: state.champion? `${K.ROSTERS[state.champion].name} 우승` : `${state.year} 시즌 종료`,

    cta:`<button class="btn primary hero-cta" onclick="App.nextSeason()">${I('calendar')}스토브리그 시작</button>`,
    more:`<button class="btn" onclick="App.showPS()">${I('trophy')}시즌 결과</button>`};
}

    else starters=`<p>개막전 선발 (로테이션 1번)</p><strong>${FM.esc(state.cfgs[USER].rotation[0]||'미정')}</strong><p>라인업 탭에서 개막 로테이션을 확인하세요.</p>`;
  } else if(h.tbd){
    matchup=`${mark(USER)}<span class="versus">VS</span><div class="club-mark"><span class="tbd-badge" aria-hidden="true">?</span><div><strong>미정</strong><small>상대 미정</small></div></div><div class="match-meta"><span>${h.tbd}</span><p>일정 미정</p></div>`;
  } else matchup='';
  const hero=`<section class="hero" aria-labelledby="heroTitle">
    <div class="hero-top"><p class="eyebrow">${h.eyebrow}</p><span class="chip team">${phaseLabel()}</span></div>
    <h1 class="hero-title" id="heroTitle">${FM.esc(h.title)}</h1><p class="hero-sub">${h.sub}</p>
    ${matchup?`<div class="matchup">${matchup}</div>`:'<div style="height:18px"></div>'}
    <div class="hero-bottom"><div>${starters}</div><div class="hero-actions">${h.cta}</div></div>
    ${h.more?`<div class="hero-more">${h.more}</div>`:''}
    ${h.progress!=null?`<div class="progress" title="정규시즌 진행률 ${h.progress}%"><i style="width:${h.progress}%"></i></div>`:''}
  </section>`;

  const tasks=FM.dashTasks(), shown=showAllTasks? tasks : tasks.slice(0,3);
  const taskHtml=`<section class="panel tasks" aria-labelledby="taskHead">
    <div class="section-head"><h2 id="taskHead">지금 결정할 일</h2><span class="chip ${tasks.length?'warn':'good'}">${tasks.length? tasks.length+'건 대기' : '모두 처리'}</span></div>
    ${tasks.length? `<ul class="task-list">${shown.map(x=>`<li>${I(x.ic)}<div><h3>${FM.esc(x.t)}</h3><p>${FM.esc(x.d)}</p></div><button class="btn" onclick="${x.go}">${x.a}</button></li>`).join('')}</ul>
      ${tasks.length>3?`<button class="btn btn-quiet btn-sm" style="margin-top:6px" onclick="App.allTasks()">${showAllTasks?'접기':`전체 보기 (${tasks.length}건)`}</button>`:''}`
      : `<p class="muted" style="margin:12px 0 0">지금 감독이 결정할 일은 없습니다. 경기를 진행하세요.</p>`}
  </section>`;

  const games=st[0].W+st[0].L+st[0].T>0;
  const gb=x=>((st[0].W-x.W)+(x.L-st[0].L))/2;
  const standRows=st.map((x,i)=>`<tr class="${x.t===USER?'selected':''}"><td><details><summary><span class="rk">${i+1}</span>${teamDot(x.t)} ${x.t}${x.t===USER?' · 내 팀':''}</summary>
      <p class="row-detail">득점 ${x.RF} · 실점 ${x.RA} (${x.diff>=0?'+':''}${x.diff})${x.T?` · ${x.T}무`:''}<br>최근 5경기 ${recentForm(x.t)}</p></details></td>
    <td>${x.W}–${x.L}</td><td>${x.gp?fmtAvg(x.pct):'—'}</td><td>${!games||i===0?'—':gb(x).toFixed(1)}</td></tr>`).join("");
  const standHtml=`<section class="panel"><div class="section-head"><h3>리그 순위</h3><span class="chip">${state.phase==='regular'||state.phase==='postseason'||state.phase==='offseason'? me.gp+'경기 기준' : '시즌 시작 전'}</span></div>
    <table class="stat-table"><caption>구단명을 누르면 득실과 최근 흐름을 펼칩니다.${rank<=5&&games?' · 현재 가을야구 진출권':''}</caption>
      <thead><tr><th scope="col">구단</th><th scope="col">승–패</th><th scope="col">승률</th><th scope="col">차</th></tr></thead><tbody>${standRows}</tbody></table></section>`;

  const userGames=state.schedule.filter(g=>g.home===USER||g.away===USER);
  const recent=userGames.filter(g=>g.played).slice(-5).reverse();
  const recentHtml = recent.length? recent.map(g=>{
    const opp=g.home===USER?g.away:g.home, us=g.home===USER?g.hr:g.ar, them=g.home===USER?g.ar:g.hr, w=us>them, t=us===them;
    return `<div class="game-row"><span>${g.home===USER?'vs':'@'} ${teamDot(opp)} ${K.ROSTERS[opp].name}</span><span class="${t?'muted':(w?'win':'lose')}"><b>${t?'무':(w?'승':'패')}</b> ${us}:${them}</span></div>`;
  }).join("") : `<p class="muted" style="margin:10px 0 0;font-size:13px">정규시즌 경기를 치르면 표시됩니다.</p>`;
  const myBat=Object.entries(state.season[USER].bat).map(([n,s])=>({n,s})).filter(x=>x.s.AB>0);
  const topAvg=myBat.slice().sort((a,b)=> (b.s.H/b.s.AB)-(a.s.H/a.s.AB))[0];
  const topHR=myBat.slice().sort((a,b)=>b.s.HR-a.s.HR)[0];
  const topRBI=myBat.slice().sort((a,b)=>b.s.RBI-a.s.RBI)[0];
  const leaders=`<section class="panel"><div class="section-head"><h3>최근 경기 · 팀 리더</h3>${me.gp?`<span class="chip">${me.W}승 ${me.L}패 ${me.T}무</span>`:''}</div>
    ${recentHtml}
    ${topAvg? `<div class="metric-grid" style="grid-template-columns:repeat(3,1fr)">
      <div><small>타율 1위</small><b>${fmtAvg(topAvg.s.H/topAvg.s.AB)}</b><small>${topAvg.n}</small></div>
      <div><small>홈런 1위</small><b>${topHR.s.HR}</b><small>${topHR.n}</small></div>
      <div><small>타점 1위</small><b>${topRBI.s.RBI}</b><small>${topRBI.n}</small></div></div>` : ''}
    <p class="hint" style="margin:14px 0 0">${FM.teamPitch(USER)}</p></section>`;

  return hero + taskHtml + (state.phase==="spring"? FM.preseasonCard() : '')
    + `<div class="reference"><div class="stack">${standHtml}${leaders}</div>${FM.dashBrief()}</div>`;
}

function batRow(team,p,showStat){

  let stat="";
  if(showStat){
    if(s&&s.AB>0) stat=`<td>${s.G}</td><td>${s.AB}</td><td>${s.H}</td><td>${s.HR}</td><td>${s.RBI}</td><td>${s.R}</td><td>${s.BB}</td><td>${s.SO}</td><td>${s.SB||0}</td><td><b>${fmtAvg(s.H/s.AB)}</b></td><td>${fmtAvg((s.H+s.BB+s.HBP)/(s.AB+s.BB+s.HBP+(s.SF||0)))}</td>`;
    else stat=`<td colspan="11" class="muted">기록 없음</td>`;

let squadView="bat";

const POS_OPTS=['C','1B','2B','3B','SS','LF','CF','RF','DH'];
function userPositions(){ const c=state.cfgs[USER]; if(!c.positions||c.positions.length!==c.lineup.length) c.positions=K.autoPositions(USER,c.lineup); return c.positions; }
function userLineupTable(){
  const c=state.cfgs[USER]; const r=K.ROSTERS[USER]; const pos=userPositions();
  const batOpts=(sel)=>r.batters.map(b=>`<option value="${b.n}" ${b.n===sel?'selected':''}>${b.n} (${b.pos}·${K.ovr(b)})</option>`).join("");
  const lineupRows=c.lineup.map((n,i)=>{
    const b=K.ROSTERS[USER].batters.find(x=>x.n===n);
    const fit=b? K.posFit(b,pos[i]) : 0;
    const fitTxt= pos[i]==='DH'? '<span class="muted">DH</span>' : fit===0? '<span style="color:var(--good)">✓ 주 포지션</span>' : fit<10? `<span style="color:var(--warn)">수비 -${fit}</span>` : `<span style="color:var(--bad)">수비 -${fit}</span>`;
    return `<tr><td><b>${i+1}</b></td>
      <td class="name"><select onchange="App.setLineup(${i},this.value)">${batOpts(n)}</select></td>
      <td><select onchange="App.setPos(${i},this.value)" aria-label="${i+1}번 타자 수비 위치">${POS_OPTS.map(x=>`<option ${x===pos[i]?'selected':''}>${x}</option>`).join('')}</select></td>
      <td style="white-space:nowrap">${fitTxt}</td>

  }).join("");
  const issues=K.positionIssues(USER,c.lineup,pos);

  return `<div style="overflow-x:auto"><table><thead><tr><th>순서</th><th class="name">선수</th><th>위치</th><th>적합도</th><th>주요능력</th><th>상태</th></tr></thead><tbody>${lineupRows}</tbody></table></div>

function renderLineup(){

      </div></div>`; })() : '';
  return banner + `<div class="grid cols2">
    <div class="card"><h3>타순 · 수비 위치 <span class="tag">8개 수비 위치 + 지명타자</span></h3>

      <div class="hint" style="margin-top:10px">선발은 투구수(체력에 따라 70~112구)나 5실점에서 교체됩니다. 불펜은 능력치 순으로 한 이닝씩 맡고, 지친 투수(컨디션 55% 미만)는 건너뜁니다. 9회 1~3점 차 리드 때 마무리가 등판합니다.</div>

function renderSched(){

  const userGames=state.schedule.map((g,idx)=>({g,idx})).filter(x=>x.g.home===USER||x.g.away===USER);
  const rows=userGames.map(x=>{
    const g=x.g; const opp=g.home===USER?g.away:g.home; const homeAway=g.home===USER?'홈':'원정';
    let result="-";
    if(g.played){ const us=g.home===USER?g.hr:g.ar, them=g.home===USER?g.ar:g.hr; const w=us>them,t=us===them;

    return `<tr style="${isNext?'background:color-mix(in srgb, var(--accent) 14%, transparent)':''}"><td>${Math.floor(userGames.indexOf(x))+1}</td>
      <td>${homeAway}</td><td class="name">${teamDot(opp)} ${K.ROSTERS[opp].name}</td><td>${result}</td>${isNext?'<td>▶ 다음</td>':'<td></td>'}</tr>`;
  }).join("");
  const ctrl = state.phase==="regular"?`<div class="row" style="margin-bottom:12px">

function gb(top,x){ return ((top.W-x.W)+(x.L-top.L))/2 ? (((top.W-x.W)+(x.L-top.L))/2).toFixed(1):'-'; }

let leaderCat="avg";
function renderLeaders(){
  const cats=[["avg","타율"],["hr","홈런"],["rbi","타점"],["r","득점"],["h","안타"],["sb","도루"],["ops","OPS"],["era","평균자책"],["whip","WHIP"],["w","다승"],["so","탈삼진"],["sv","세이브"],["hd","홀드"]];
  const tabs=`<div class="tabsm">${cats.map(([id,l])=>`<button class="${leaderCat===id?'active':''}" onclick="App.leaderCat('${id}')">${l}</button>`).join("")}</div>`;
  // gather
  let bat=[],pit=[];
  K.TEAM_IDS.forEach(t=>{
    for(const n in state.season[t].bat){ const s=state.season[t].bat[n]; bat.push({t,n,s}); }
    for(const n in state.season[t].pit){ const s=state.season[t].pit[n]; pit.push({t,n,s}); }
  });
  const minAB = Math.max(20, state.gameIdx/state.schedule.length*144*2.7);
  const minOut = Math.max(30, state.gameIdx/state.schedule.length*144*3); // 규정이닝: 팀 경기 수 x 1이닝 (아웃 3개)
  let rows="",head="";
  function brow(x,val,extra){return `<tr class="${x.t===USER?'me rankrow':''}"><td>${x.rank}</td><td class="name">${teamDot(x.t)} ${pname(x.t,x.n)}</td><td class="muted">${x.t}</td><td><b>${val}</b></td>${extra||''}</tr>`;}
  if(["avg","hr","rbi","r","h","sb","ops"].includes(leaderCat)){
    let arr=bat.filter(x=>x.s.AB>0);
    const ops=s=>(s.H+s.BB+s.HBP)/Math.max(1,s.AB+s.BB+s.HBP+(s.SF||0))+(s.H+s._2B+2*s._3B+3*s.HR)/s.AB;
    if(leaderCat==="ops"){ arr=arr.filter(x=>x.s.AB>=minAB).sort((a,b)=>ops(b.s)-ops(a.s));
      head=`<th>OPS</th><th>타율</th><th>HR</th><th>타점</th>`;
      rows=arr.slice(0,15).map((x,i)=>{x.rank=i+1;return brow(x,ops(x.s).toFixed(3),`<td>${fmtAvg(x.s.H/x.s.AB)}</td><td>${x.s.HR}</td><td>${x.s.RBI}</td>`);}).join(""); }
    else
    if(leaderCat==="avg"){ arr=arr.filter(x=>x.s.AB>=minAB).sort((a,b)=>(b.s.H/b.s.AB)-(a.s.H/a.s.AB));
      head=`<th>타율</th><th>AB</th><th>H</th><th>HR</th>`;
      rows=arr.slice(0,15).map((x,i)=>{x.rank=i+1;return brow(x,fmtAvg(x.s.H/x.s.AB),`<td>${x.s.AB}</td><td>${x.s.H}</td><td>${x.s.HR}</td>`);}).join("");}
    else { const key={hr:"HR",rbi:"RBI",r:"R",h:"H",sb:"SB"}[leaderCat]; arr=arr.sort((a,b)=>(b.s[key]||0)-(a.s[key]||0));
      head=`<th>${{hr:'홈런',rbi:'타점',r:'득점',h:'안타',sb:'도루'}[leaderCat]}</th><th>타율</th><th>HR</th><th>타점</th>`;
      rows=arr.slice(0,15).map((x,i)=>{x.rank=i+1;return brow(x,x.s[key]||0,`<td>${fmtAvg(x.s.H/x.s.AB)}</td><td>${x.s.HR}</td><td>${x.s.RBI}</td>`);}).join("");}
  } else {
    let arr=pit.filter(x=>x.s.G>0);
    if(leaderCat==="whip"){ arr=arr.filter(x=>x.s.OUT>=minOut).sort((a,b)=>((a.s.H+a.s.BB)/a.s.OUT)-((b.s.H+b.s.BB)/b.s.OUT));
      head=`<th>WHIP</th><th>ERA</th><th>IP</th><th>SO</th>`;
      rows=arr.slice(0,15).map((x,i)=>{x.rank=i+1;return brow(x,((x.s.H+x.s.BB)*3/x.s.OUT).toFixed(2),`<td>${fmtEra(x.s.ER,x.s.OUT)}</td><td>${ipStr(x.s.OUT)}</td><td>${x.s.SO}</td>`);}).join(""); }
    else if(leaderCat==="era"){ arr=arr.filter(x=>x.s.OUT>=minOut).sort((a,b)=>(a.s.ER/a.s.OUT)-(b.s.ER/b.s.OUT));
      head=`<th>ERA</th><th>IP</th><th>W</th><th>SO</th>`;
      rows=arr.slice(0,15).map((x,i)=>{x.rank=i+1;return brow(x,fmtEra(x.s.ER,x.s.OUT),`<td>${ipStr(x.s.OUT)}</td><td>${x.s.W}</td><td>${x.s.SO}</td>`);}).join("");}
    else { const key={w:"W",so:"SO",sv:"SV",hd:"HD"}[leaderCat]; arr=arr.sort((a,b)=>(b.s[key]||0)-(a.s[key]||0));
      head=`<th>${{w:'승',so:'탈삼진',sv:'세이브',hd:'홀드'}[leaderCat]}</th><th>ERA</th><th>IP</th><th>SO</th>`;
      rows=arr.slice(0,15).map((x,i)=>{x.rank=i+1;return brow(x,x.s[key]||0,`<td>${fmtEra(x.s.ER,x.s.OUT)}</td><td>${ipStr(x.s.OUT)}</td><td>${x.s.SO}</td>`);}).join("");}
  }
  return `<div class="card"><h3>리그 기록실 <span class="tag">${state.year} 시즌</span></h3>${tabs}
    <table><thead><tr><th>순위</th><th class="name">선수</th><th>팀</th>${head}</tr></thead><tbody>${rows||'<tr><td colspan="7" class="muted">기록 없음 — 경기를 진행하세요</td></tr>'}</tbody></table></div>`;
}

// ---------- trade ----------
let tradeOut=new Set(), tradeTeam=null, tradeIn=new Set();
function playerValue(p){
  const o=K.ovr(p);
  const ageAdj = p.age<=25? 6 : p.age<=28? 3 : p.age<=31?0 : p.age<=34?-4 : -9;
  return o + ageAdj;
}
function renderTrade(){
  const teams=K.TEAM_IDS.filter(t=>t!==USER);
  if(!tradeTeam) tradeTeam=teams[0];
  const myAll=[...K.ROSTERS[USER].batters,...K.ROSTERS[USER].pitchers].sort((a,b)=>K.ovr(b)-K.ovr(a));
  const themAll=[...K.ROSTERS[tradeTeam].batters,...K.ROSTERS[tradeTeam].pitchers].sort((a,b)=>K.ovr(b)-K.ovr(a));
  [...tradeOut].forEach(n=>{ if(!myAll.some(p=>p.n===n)) tradeOut.delete(n); });
  [...tradeIn].forEach(n=>{ if(!themAll.some(p=>p.n===n)) tradeIn.delete(n); });
  const itemOut=p=>`<label class="checkitem"><input type="checkbox" ${tradeOut.has(p.n)?'checked':''} onchange="App.toggleOut('${p.n}')">
    <span class="ovr ${ovrClass(K.ovr(p))}">${K.ovr(p)}</span> ${p.n} <span class="muted">${p.pos||p.role}·${p.age}세</span></label>`;
  const itemIn=p=>`<label class="checkitem"><input type="checkbox" ${tradeIn.has(p.n)?'checked':''} onchange="App.toggleIn('${p.n}')">
    <span class="ovr ${ovrClass(K.ovr(p))}">${K.ovr(p)}</span> ${p.n} <span class="muted">${p.pos||p.role}·${p.age}세</span></label>`;
  const outVal=[...tradeOut].reduce((a,n)=>a+playerValue(findPlayer(USER,n)),0);
  const inVal=[...tradeIn].reduce((a,n)=>a+playerValue(findPlayer(tradeTeam,n)),0);
  const budget = FM.tradeBudget([...tradeOut],tradeTeam,[...tradeIn]);
  const valueOk = inVal>0 && outVal>=inVal*0.98;
  const roster = tradeOut.size||tradeIn.size? FM.tradeCheck(tradeTeam,[...tradeOut],[...tradeIn]) : "";
  const accept = valueOk && budget.ok && !roster;
  return `<div class="card"><h3>트레이드 <span class="tag">${FM.tradeTag()}</span></h3>${FM.tradeWindow().open? "" : `<div class="deal-result deal-no" style="margin-bottom:10px">${FM.tradeWindow().msg}</div>`}
    <div class="row" style="margin-bottom:10px">상대팀: <select onchange="App.tradeTeam(this.value)">${teams.map(t=>`<option value="${t}" ${t===tradeTeam?'selected':''}>${K.ROSTERS[t].name}</option>`).join("")}</select></div>
    <div class="row" style="align-items:flex-start">
      <div class="trade-side"><b>내보낼 선수 (${USER})</b><div style="max-height:340px;overflow:auto;margin-top:6px">${myAll.map(itemOut).join("")}</div>
        <div style="margin-top:6px">가치 합계: <b>${outVal}</b></div></div>
      <div class="trade-side"><b>받을 선수 (${tradeTeam})</b><div style="max-height:340px;overflow:auto;margin-top:6px">${themAll.map(itemIn).join("")}</div>
        <div style="margin-top:6px">가치 합계: <b>${inVal}</b></div></div>
    </div>
    <div class="deal-result ${accept?'deal-ok':'deal-no'}">${
      tradeIn.size===0&&tradeOut.size===0? '교환할 선수를 선택하세요.' :
      accept? '✅ 상대가 받아들일 만한 제안입니다. 트레이드를 실행하세요!' :
      valueOk&&roster? '❌ '+roster :
      valueOk? '❌ '+budget.msg :
      '❌ 상대팀이 거절할 제안입니다. 더 좋은 카드를 제시하세요 (받을 가치 ≤ 내줄 가치).'}</div>
    <button class="btn primary" ${accept?'':'disabled'} onclick="App.execTrade()">🤝 트레이드 실행</button>
    <div class="muted" style="margin-top:6px">트레이드 후 연봉 총액: <b>${budget.after}억</b> / 한도 ${budget.limit}억</div>
    <div class="hint" style="margin-top:8px">선수 가치 = 능력치(OVR) + 나이 보정(어릴수록 +). 트레이드 후 라인업은 자동 재구성되니 라인업 탭에서 확인하세요.</div>
  </div>`;
}
function findPlayer(team,n){ const r=K.ROSTERS[team]; return r.batters.find(x=>x.n===n)||r.pitchers.find(x=>x.n===n)||(r.farm||[]).find(x=>x.n===n); }
function execTrade(){
  const outs=[...tradeOut].map(n=>findPlayer(USER,n)), ins=[...tradeIn].map(n=>findPlayer(tradeTeam,n));
  const outVal=outs.reduce((a,p)=>a+(p?playerValue(p):0),0), inVal=ins.reduce((a,p)=>a+(p?playerValue(p):0),0);
  if(!outs.length || !(inVal>0 && outVal>=inVal*0.98)){ FM.notify('상대팀이 거절할 제안입니다.'); render(); return; }
  const budget=FM.tradeBudget([...tradeOut],tradeTeam,[...tradeIn]); if(!budget.ok){ FM.notify(budget.msg); render(); return; }
  const why=FM.doTrade(tradeTeam,[...tradeOut],[...tradeIn]); // moves players and rebuilds both lineups
  if(why){ FM.notify(why); render(); return; }
  tradeOut.clear(); tradeIn.clear();
  FM.notify("트레이드 완료! 라인업이 자동 재구성되었습니다.");
  render();
}
