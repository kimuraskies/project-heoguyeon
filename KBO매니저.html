// ---------- save / load ----------
// Manual save and autosave use separate slots, so autosave never overwrites the manual one.
const SAVE_KEY='kbo_manager_save', AUTOSAVE_KEY='kbo_manager_autosave', SAVE_VERSION=3;
function saveData(){ return JSON.stringify({ v:SAVE_VERSION, savedAt:Date.now(), state, teamGameCount, rosters:K.ROSTERS }); }
function applySave(data){
  // restore rosters in place
  for(const t in data.rosters){ K.ROSTERS[t].batters=data.rosters[t].batters; K.ROSTERS[t].pitchers=data.rosters[t].pitchers; K.ROSTERS[t].color=data.rosters[t].color; K.ROSTERS[t].farm=data.rosters[t].farm||[]; }
  state=data.state; teamGameCount=data.teamGameCount; state.pendingGame=null;
  USER=(state.user&&state.user.team)||"KIA"; // saves from before team selection were KIA careers
  FM.applyTheme(USER);
}
function autosave(){
  if(!state) return;
  try{ localStorage.setItem(AUTOSAVE_KEY, saveData()); }catch(e){ console.warn('자동저장 실패', e); }
}
function restoreAutosave(){
  try{
    const raw=localStorage.getItem(AUTOSAVE_KEY);
    if(!raw) return false;
    const data=JSON.parse(raw);
    if((data.v||0)>SAVE_VERSION) return false; // written by a newer version of the game
    applySave(data); return true;
  }catch(e){ console.warn('자동저장 복구 실패', e); return false; }
}
function save(){
  if(!state){ FM.notify('진행 중인 게임이 없습니다. 먼저 구단을 선택하세요.'); return; }
  try{
    localStorage.setItem(SAVE_KEY, saveData());
    FM.notify('저장 완료! (이 브라우저에 저장됨)');
  }catch(e){ FM.notify('저장 실패: '+e.message); }
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw){ FM.notify('저장된 게임이 없습니다.'); return; }
    applySave(JSON.parse(raw));
    const ro=document.getElementById('relay'); if(ro)ro.remove();
    closeModal(); currentTab="dash"; $("tabs").hidden=false; render();
    FM.notify('불러오기 완료!');
  }catch(e){ FM.notify('불러오기 실패: '+e.message); }
}
function confirmNew(){ FM.ask('새 게임을 시작하면 현재 진행 상황이 사라집니다. (저장 슬롯은 유지됩니다)', '새 게임 시작', ()=>{ try{ localStorage.removeItem(AUTOSAVE_KEY); }catch(e){} location.reload(); }); }

// ---------- self test (dev) ----------
function selfTest(){
  // quick: clone-free quick season using default cfgs into temp accumulators
  const tmp={}; K.TEAM_IDS.forEach(t=>tmp[t]={bat:{},pit:{},RF:0});
  const cfg={}; K.TEAM_IDS.forEach(t=>{const d=K.defaultLineup(t);cfg[t]={teamId:t,lineup:d.lineup,positions:d.positions,bullpen:d.bullpen,closer:d.closer,rotation:d.rotation};});
  const gc={};K.TEAM_IDS.forEach(t=>gc[t]=0);
  const rr=roundRobin(K.TEAM_IDS); let games=0;
  for(let c=0;c<16;c++) rr.forEach(pairs=>pairs.forEach(p=>{
    const home=c%2?p[1]:p[0], away=c%2?p[0]:p[1];
    const hc=Object.assign({},cfg[home],{spName:cfg[home].rotation[gc[home]%5]}); gc[home]++;
    const ac=Object.assign({},cfg[away],{spName:cfg[away].rotation[gc[away]%5]}); gc[away]++;
    const res=K.simGame(hc,ac,{}); games++;
    [home,away].forEach(t=>{ for(const n in res.box[t].bat){const s=res.box[t].bat[n];const x=tmp[t].bat[n]||(tmp[t].bat[n]=K.newBatStat());for(const k in s)x[k]+=s[k];}
      for(const n in res.box[t].pit){const s=res.box[t].pit[n];const x=tmp[t].pit[n]||(tmp[t].pit[n]=K.newPitStat());for(const k in s)x[k]+=s[k];}});
    tmp[home].RF+=res.homeRuns; tmp[away].RF+=res.awayRuns;
  }));
  let AB=0,H=0,HR=0,BB=0,SO=0,PA=0,ER=0,OUT=0,RUN=0;
  K.TEAM_IDS.forEach(t=>{ for(const n in tmp[t].bat){const s=tmp[t].bat[n];AB+=s.AB;H+=s.H;HR+=s.HR;BB+=s.BB;SO+=s.SO;PA+=s.PA;}
    for(const n in tmp[t].pit){const s=tmp[t].pit[n];ER+=s.ER;OUT+=s.OUT;} RUN+=tmp[t].RF; });
  const msg=`[엔진 검증 · ${games}경기]\n리그 타율: ${fmtAvg(H/AB)}\n리그 ERA: ${(ER*9/(OUT/3)).toFixed(2)}\n경기당 팀 득점: ${(RUN/games).toFixed(2)}\n총 홈런: ${HR} (경기당 ${(HR/games).toFixed(2)})\nK%: ${(SO/PA*100).toFixed(1)}  BB%: ${(BB/PA*100).toFixed(1)}`;
  FM.notify(msg, 12000); console.log(msg);
}

// ---------- App API ----------
const App={
  tab:(t)=>{currentTab=t;render();},
  squadView:(v)=>{squadView=v;render();},
  leaderCat:(c)=>{leaderCat=c;render();},
  nextGame:()=>startNextUserGame(),
  allTasks:()=>{ showAllTasks=!showAllTasks; render(); },
  startMatch:()=>Match.start(),
  cancelPreview:()=>{ closeModal(); closePreview(); },
  takeJob:(t)=>FM.takeJob(t),
  player:(t,n)=>FM.showProfile(t,n),
  userGames:(n)=>advanceUserGames(n),
  simRest:()=>FM.ask('남은 정규시즌을 모두 시뮬레이션합니다.', '시즌 끝까지 진행', simRestOfSeason),
  // moving a hitter within the order keeps his position; a bench player takes over the slot's position
  setLineup:(i,v)=>{ const c=state.cfgs[USER], pos=userPositions();
    const old=c.lineup.indexOf(v); if(old>=0&&old!==i){ c.lineup[old]=c.lineup[i]; const tp=pos[old]; pos[old]=pos[i]; pos[i]=tp; } c.lineup[i]=v; render(); },
  setPos:(i,v)=>{ const pos=userPositions(); const old=pos.indexOf(v); if(old>=0&&old!==i){ pos[old]=pos[i]; } pos[i]=v; render(); },
  setRotation:(i,v)=>{ const c=state.cfgs[USER]; const old=c.rotation.indexOf(v); if(old>=0&&old!==i){c.rotation[old]=c.rotation[i];} c.rotation[i]=v; render(); },
  setCloser:(v)=>{ state.cfgs[USER].closer=v; render(); },
  autoLineup:()=>{ const d=K.defaultLineup(USER); state.cfgs[USER].lineup=d.lineup.slice(); state.cfgs[USER].positions=d.positions.slice(); render(); },
  psNext:()=>psPlayNext(),
  setTac:(scope,k,v)=>FM.setTac(scope,k,v),
  psAuto:(toEnd)=>psAuto(toEnd),
  tradeTeam:(t)=>{ tradeTeam=t; tradeIn.clear(); render(); },
  toggleOut:(n)=>{ tradeOut.has(n)?tradeOut.delete(n):tradeOut.add(n); render(); },
  toggleIn:(n)=>{ tradeIn.has(n)?tradeIn.delete(n):tradeIn.add(n); render(); },
  execTrade:execTrade,
  showPS:showPS,
  nextSeason:()=>FM.confirmNextSeason(nextSeason),
  closeModal:closeModal,
  save:save, load:load, confirmNew:confirmNew, selfTest:selfTest
};
window.App=App;
window.Match=Match;

// ---------- boot ----------
function boot(){
  if(!K){ document.getElementById('view').innerHTML='<div class="card">엔진(core.js) 로드 실패. core.js가 같은 폴더에 있는지 확인하세요.</div>'; return; }
  if(restoreAutosave()){ render(); return; } // pick up where the last session left off (refresh, closed tab)
  FM.showSetup(); // new career: manager profile + club selection
}
// setup screen finished: start the season for the chosen club
function beginCareer(user){
  USER=user.team; FM.applyTheme(USER);
  initState();
  state.user=user;
  FM.onCareerStart();
  currentTab="dash"; render();
}
boot();
</script>
